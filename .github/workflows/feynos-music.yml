              suspend fun recordingMetadata(mbids: List<String>): Map<String, LbTrack> {
                  val out = LinkedHashMap<String, LbTrack>()
                  for (chunk in mbids.chunked(25)) {
                      val r = fetch("/1/metadata/recording/?recording_mbids=${chunk.joinToString(",")}&inc=artist").obj ?: continue
