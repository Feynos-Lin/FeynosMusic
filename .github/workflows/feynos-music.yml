          /** Scan the whole library for albums without art. */
          @Composable
          fun CoverArtScreen() {
              val nav = LocalNavi.current
              val scan by graph.covers.scan.collectAsStateWithLifecycle()
              val found by graph.covers.overrides.collectAsStateWithLifecycle()
              val r = rememberLoad(found, scan.running) {
                  withContext(Dispatchers.IO) { graph.db.coverRows().filter { it.missing || it.url != null }.sortedBy { it.name.lowercase() } }
              }
              Column(Modifier.fillMaxSize()) {
                  TopBar("Cover art", onBack = { nav.back() })
                  LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(bottom = 24.dp)) {
                      item {
                          Card(
                              Modifier.fillMaxWidth().padding(16.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceContainerHigh),
                          ) {
                              Column(Modifier.padding(16.dp)) {
                                  Text("Find missing cover art", fontWeight = FontWeight.Bold)
                                  Text(
                                      "Finds albums that only show Navidrome's placeholder and looks up the real cover on " +
                                          "MusicBrainz (Cover Art Archive), Deezer and iTunes. Found covers show everywhere in this app, " +
                                          "including the lock screen. To fix one by hand, open the album and tap the image icon.",
                                      style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      modifier = Modifier.padding(top = 4.dp),
                                  )
                                  Spacer(Modifier.height(12.dp))
                                  if (scan.running) {
                                      Text("${scan.phase}… ${scan.done}/${scan.total}", style = MaterialTheme.typography.bodyMedium)
                                      if (scan.missing > 0) {
                                          Text(
                                              "${scan.missing} albums need art · ${scan.found} found so far",
                                              style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          )
                                      }
                                      Spacer(Modifier.height(8.dp))
                                      LinearProgressIndicator(
                                          progress = { if (scan.total > 0) scan.done.toFloat() / scan.total else 0f },
                                          modifier = Modifier.fillMaxWidth(),
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      OutlinedButton(onClick = { graph.covers.stopScan() }) { Text("Stop") }
                                  } else {
                                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Button(onClick = { graph.covers.startScan(full = false) }) { Text("Scan library") }
                                          OutlinedButton(onClick = { graph.covers.startScan(full = true) }) { Text("Re-check everything") }
                                      }
                                  }
                              }
                          }
                      }
                      val rows = r.data.orEmpty()
                      val fixed = rows.filter { it.url != null }
                      val notFound = rows.filter { it.url == null && it.missing }
                      if (fixed.isNotEmpty()) {
                          item { SectionHeader("Fixed (${fixed.size})") }
                          items(fixed) { row -> CoverRowItem(row, onClick = { nav.album(row.albumId) }) }
                      }
                      if (notFound.isNotEmpty()) {
                          item { SectionHeader("Still missing (${notFound.size})") }
                          items(notFound) { row -> CoverRowItem(row, onClick = { nav.album(row.albumId) }) }
                      }
                      if (rows.isEmpty() && !scan.running) {
                          item { EmptyState(Icons.Rounded.ImageSearch, "Nothing scanned yet", "Tap Scan library to check every album.") }
                      }
                  }
              }
          }

