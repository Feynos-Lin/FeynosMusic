              }
              val entry by nav.currentBackStackEntryAsState()

              fun select(route: String) {
                  showPlayer = false
                  // If that tab's page is already underneath (e.g. Home under Settings), go straight back to it.
                  if (nav.popBackStack(route, inclusive = false)) return
                  nav.navigate(route) {
                      popUpTo(nav.graph.findStartDestination().id)
                      launchSingleTop = true
                  }
              }

              CompositionLocalProvider(LocalNavi provides navi) {
                  Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {
                      Row(Modifier.fillMaxSize()) {
                          if (wide) {
                              NavigationRail(containerColor = MaterialTheme.colorScheme.surface) {
                                  Spacer(Modifier.height(12.dp))
                                  tabs.forEach { t ->
                                      NavigationRailItem(
                                          selected = entry?.destination?.hierarchy?.any { it.route == t.route } == true,
                                          onClick = { select(t.route) },
                                          icon = { Icon(t.icon, t.label) },
                                          label = { Text(t.label) },
                                      )
                                  }
                              }
                          }
                          Column(Modifier.weight(1f).fillMaxHeight().then(if (wide) Modifier.navigationBarsPadding() else Modifier)) {
                              Box(Modifier.weight(1f)) {
                                  NavHost(
                                      navController = nav,
                                      startDestination = "home",
                                      enterTransition = { fadeIn(tween(180)) },
                                      exitTransition = { fadeOut(tween(180)) },
                                  ) {
                                      composable("home") { HomeScreen() }
                                      composable("search") { SearchScreen() }
                                      composable("foryou") { ForYouScreen() }
                                      composable("library") { LibraryScreen() }
                                      composable("album/{id}") { AlbumScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("artist/{id}") { ArtistScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("playlist/{id}") { PlaylistScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("mix/{id}") { MixScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("lb/{id}") { LbPlaylistScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("genre/{id}") { GenreScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("albums/{id}") { AlbumsScreen(it.arguments?.getString("id").orEmpty()) }
                                      composable("liked") { LikedScreen() }
                                      composable("downloads") { DownloadsScreen() }
                                      composable("history") { HistoryScreen() }
                                      composable("stats") { StatsScreen() }
                                      composable("settings") { SettingsScreen() }
                                      composable("covers") { CoverArtScreen() }
                                      composable("jam") { JamScreen() }
                                  }
                                  SnackbarHost(snack, Modifier.align(Alignment.BottomCenter))
                              }
                              JamBanner()
                              if (ps.song != null) MiniPlayer(ps, onOpen = { showPlayer = true })
                              if (!wide) {
                                  NavigationBar(containerColor = MaterialTheme.colorScheme.surface, tonalElevation = 0.dp) {
                                      tabs.forEach { t ->
                                          NavigationBarItem(
                                              selected = entry?.destination?.hierarchy?.any { it.route == t.route } == true,
                                              onClick = { select(t.route) },
                                              icon = { Icon(t.icon, t.label) },
                                              label = { Text(t.label) },
                                          )
                                      }
                                  }
                              }
                          }
                      }
                      AnimatedVisibility(
                          visible = showPlayer && ps.song != null,
                          enter = slideInVertically(tween(300)) { it },
                          exit = slideOutVertically(tween(250)) { it },
                      ) {
                          NowPlayingScreen(onClose = { showPlayer = false })
                      }
                  }
                  BackHandler(enabled = showPlayer) { showPlayer = false }
                  addRequest?.let { songs -> AddToPlaylistDialog(songs) { graph.addToPlaylistRequest.value = null } }
                  update?.let { info -> UpdateDialog(info) { update = null } }
              }
          }

          @Composable
          fun MiniPlayer(ps: PlayerState, onOpen: () -> Unit) {
              val song = ps.song ?: return
              var drag by remember { mutableFloatStateOf(0f) }
              val overrides by graph.starOverrides.collectAsStateWithLifecycle()
              val starred = overrides[song.id] ?: (song.starred != null)
              val bg = rememberDominantColor(song.coverArt, song.albumId)
              Box(
                  Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp)
                      .clip(RoundedCornerShape(10.dp))
                      .background(lerp(bg, MaterialTheme.colorScheme.surfaceContainerHigh, 0.35f))
                      .clickable(onClick = onOpen)
                      .pointerInput(Unit) {
                          detectHorizontalDragGestures(
                              onDragEnd = {
                                  if (drag < -120f) graph.player.next() else if (drag > 120f) graph.player.previous()
                                  drag = 0f
                              },
                              onDragCancel = { drag = 0f },
                          ) { _, amount -> drag += amount }
                      },
              ) {
                  Row(Modifier.padding(6.dp), verticalAlignment = Alignment.CenterVertically) {
                      Cover(song.coverArt, Modifier.size(44.dp), size = 150, shape = RoundedCornerShape(6.dp), albumId = song.albumId)
                      Spacer(Modifier.width(10.dp))
                      Column(Modifier.weight(1f)) {
                          Text(song.title, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.basicMarquee())
                          Text(
                              song.artist.orEmpty(), style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis,
                          )
                      }
                      IconButton(onClick = { graph.toggleStar(song) }) {
                          Icon(
                              if (starred) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder, "Like",
                              tint = if (starred) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface,
                          )
                      }
                      IconButton(onClick = { graph.player.toggle() }) {
                          if (ps.buffering && !ps.isPlaying) CircularProgressIndicator(Modifier.size(22.dp), strokeWidth = 2.dp)
                          else Icon(if (ps.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow, "Play or pause", modifier = Modifier.size(30.dp))
                      }
                  }
                  val progress = if (ps.durationMs > 0) (ps.positionMs.toFloat() / ps.durationMs).coerceIn(0f, 1f) else 0f
                  Box(
                      Modifier.align(Alignment.BottomStart).padding(horizontal = 10.dp).fillMaxWidth()
                          .height(2.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.2f)),
                  ) {
                      Box(Modifier.fillMaxWidth(progress).fillMaxHeight().background(Color.White))
                  }
              }
          }

          @Composable
          fun AddToPlaylistDialog(songs: List<Song>, onDismiss: () -> Unit) {
              val r = rememberLoad(Unit) { graph.api.playlists() }
              var newName by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Add to playlist") },
                  text = {
                      Column {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              OutlinedTextField(
                                  value = newName, onValueChange = { newName = it }, singleLine = true,
                                  label = { Text("New playlist") }, modifier = Modifier.weight(1f),
                              )
                              IconButton(
                                  enabled = newName.isNotBlank(),
                                  onClick = {
                                      val name = newName.trim()
                                      scope.launch {
                                          try {
                                              graph.api.createPlaylist(name, songs.map { it.id })
                                              graph.toast("Created \"$name\"")
                                              graph.bump()
                                          } catch (e: Exception) {
                                              graph.toast("Couldn't create playlist: ${e.message}")
                                          }
                                          onDismiss()
                                      }
                                  },
                              ) { Icon(Icons.Rounded.Add, "Create") }
                          }
                          Spacer(Modifier.height(8.dp))
                          HorizontalDivider()
                          val list = r.data
                          when {
                              list == null && r.error == null -> LoadingBox()
                              list == null -> Text(r.error ?: "", color = MaterialTheme.colorScheme.error)
                              else -> LazyColumn(Modifier.heightIn(max = 360.dp)) {
                                  items(list) { p ->
                                      ListItem(
                                          headlineContent = { Text(p.name, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                                          supportingContent = { Text("${p.songCount} songs") },
                                          leadingContent = { Cover(p.coverArt, Modifier.size(44.dp), size = 150) },
                                          colors = ListItemDefaults.colors(containerColor = Color.Transparent),
                                          modifier = Modifier.clickable {
                                              scope.launch {
                                                  try {
                                                      graph.api.addToPlaylist(p.id, songs.map { it.id })
                                                      graph.toast("Added to ${p.name}")
                                                      graph.bump()
                                                  } catch (e: Exception) {
                                                      graph.toast("Couldn't add: ${e.message}")
                                                  }
                                                  onDismiss()
                                              }
                                          },
                                      )
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } },
              )
          }

          @Composable
          fun UpdateDialog(info: UpdateInfo, onDismiss: () -> Unit) {
              var progress by remember { mutableStateOf<Float?>(null) }
              val scope = rememberCoroutineScope()
              AlertDialog(
                  onDismissRequest = { if (progress == null) onDismiss() },
                  title = { Text("Update available: ${info.version}") },
                  text = {
                      Column {
                          val p = progress
                          if (p != null) {
                              LinearProgressIndicator(progress = { p }, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(12.dp))
                          }
                          Text(
                              info.notes.ifBlank { "A new version is ready." },
                              modifier = Modifier.heightIn(max = 300.dp).verticalScroll(rememberScrollState()),
                          )
                      }
                  },
                  confirmButton = {
                      TextButton(
                          enabled = progress == null,
                          onClick = {
                              scope.launch {
                                  progress = 0f
                                  try {
                                      val file = graph.updater.download(info) { v -> progress = v }
                                      if (graph.updater.install(file)) onDismiss()
                                      else graph.toast("Allow installs from Feynos Music, then tap Update again")
                                  } catch (e: Exception) {
                                      graph.toast("Update failed: ${e.message}")
                                  }
                                  progress = null
                              }
                          },
                      ) { Text("Update") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss, enabled = progress == null) { Text("Later") } },
              )
          }
          FEYNOS_EOF_058
          cat > 'app/src/main/java/com/feynos/music/ui/Theme.kt' <<'FEYNOS_EOF_059'
          package com.feynos.music.ui

          import android.os.Build
          import androidx.compose.material3.ColorScheme
          import androidx.compose.material3.LocalContentColor
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          /** A colour theme. The "-style" ones borrow the colour feel of other music apps (no logos or branding). */
          data class AppTheme(
              val id: String,
              val name: String,
              val accent: Long,
              val onAccent: Long,
              val background: Long,
              val surface: Long,
              val variant: Long,
              val container: Long,
          )

          val Themes = listOf(
              AppTheme("feynos", "Feynos purple", 0xFFA970FF, 0xFF14002E, 0xFF0E0E12, 0xFF131318, 0xFF26262F, 0xFF3A2766),
              AppTheme("spotify", "Green & black (Spotify-style)", 0xFF1ED760, 0xFF000000, 0xFF121212, 0xFF181818, 0xFF2A2A2A, 0xFF0F3D22),
              AppTheme("apple", "Rose red (Apple Music-style)", 0xFFFA2D48, 0xFFFFFFFF, 0xFF000000, 0xFF111113, 0xFF2C2C2E, 0xFF4A1019),
              AppTheme("youtube", "Red & black (YouTube Music-style)", 0xFFFF0033, 0xFFFFFFFF, 0xFF030303, 0xFF0F0F0F, 0xFF272727, 0xFF4A0010),
              AppTheme("soundcloud", "Orange (SoundCloud-style)", 0xFFFF5500, 0xFFFFFFFF, 0xFF121212, 0xFF1A1A1A, 0xFF2E2E2E, 0xFF4D1C00),
              AppTheme("tidal", "Black & cyan (Tidal-style)", 0xFF33FFEE, 0xFF00201D, 0xFF000000, 0xFF0D0D0D, 0xFF242424, 0xFF0B3D3A),
              AppTheme("amazon", "Teal (Amazon Music-style)", 0xFF25D1DA, 0xFF00282A, 0xFF0B0F12, 0xFF12181D, 0xFF232F3E, 0xFF0E3B42),
              AppTheme("deezer", "Violet (Deezer-style)", 0xFFA238FF, 0xFFFFFFFF, 0xFF0F0D13, 0xFF191622, 0xFF2A2533, 0xFF3B1A66),
          )

          fun themeById(id: String): AppTheme = Themes.firstOrNull { it.id == id } ?: Themes[0]

          val Accent = Color(0xFFA970FF)
          val AppBackground = Color(0xFF0E0E12)

          private fun lighten(c: Color, amount: Float) = Color(
              c.red + (1 - c.red) * amount, c.green + (1 - c.green) * amount, c.blue + (1 - c.blue) * amount, 1f,
          )

          fun schemeFor(t: AppTheme): ColorScheme {
              val accent = Color(t.accent)
              val surface = Color(t.surface)
              val variant = Color(t.variant)
              return darkColorScheme(
                  primary = accent,
                  onPrimary = Color(t.onAccent),
                  primaryContainer = Color(t.container),
                  onPrimaryContainer = lighten(accent, 0.75f),
                  secondary = lighten(accent, 0.35f),
                  onSecondary = Color(t.onAccent),
                  background = Color(t.background),
                  onBackground = Color(0xFFEDEDF2),
                  surface = surface,
                  onSurface = Color(0xFFEDEDF2),
                  surfaceVariant = variant,
                  onSurfaceVariant = Color(0xFFA9A9B8),
                  surfaceContainer = lighten(surface, 0.03f),
                  surfaceContainerHigh = lighten(surface, 0.06f),
                  surfaceContainerHighest = lighten(surface, 0.1f),
                  outline = lighten(variant, 0.15f),
              )
          }

          @Composable
          fun FeynosTheme(dynamic: Boolean, theme: String = "feynos", content: @Composable () -> Unit) {
              val t = themeById(theme)
              val scheme = if (dynamic && Build.VERSION.SDK_INT >= 31) {
                  dynamicDarkColorScheme(LocalContext.current).copy(background = AppBackground)
              } else schemeFor(t)
              MaterialTheme(colorScheme = scheme) {
                  // Sets the default text/icon colour to light-on-dark for the whole app.
                  CompositionLocalProvider(LocalContentColor provides scheme.onBackground, content = content)
              }
          }
          FEYNOS_EOF_059

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using the signing key from repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS:-feynos}" >> "$GITHUB_ENV"
          else
            # No secrets: create one key on the first run and keep it in the repo,
            # so every later build is signed the same way and installs as an update.
            mkdir -p .signing
            if [ ! -f .signing/feynos-music.jks ]; then
              keytool -genkeypair -v -keystore .signing/feynos-music.jks -alias feynos \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass feynos-music -keypass feynos-music -dname "CN=Feynos Music"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .signing/feynos-music.jks
              git commit -m "Add app signing key [skip ci]" && git push || echo "Could not save the signing key to the repo"
            fi
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/.signing/feynos-music.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=feynos-music" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=feynos-music" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=feynos" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Write release notes
        run: |
          VERSION="1.0.${{ github.run_number }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Feynos Music $VERSION"
            echo
            echo "### What changed"
            if [ -n "$PREV" ]; then
              git log "$PREV"..HEAD --no-merges --pretty=format:'- %s' | grep -v '\[skip ci\]' || echo "- Rebuilt"
            else
              echo "- First release"
            fi
            echo
          } > release_notes.md
          cat release_notes.md
          cp app/build/outputs/apk/release/app-release.apk "FeynosMusic-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeynosMusic-1.0.${{ github.run_number }}
          path: FeynosMusic-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Feynos Music 1.0.${{ github.run_number }}
          body_path: release_notes.md
          files: FeynosMusic-1.0.${{ github.run_number }}.apk
          make_latest: true
