              /** Records who added songs, so the queue can show it. Host's own adds pass null. */
              fun noteAdded(songs: List<Song>, endpoint: String? = null, name: String = myName()) {
                  if (!isHost) return
                  songs.forEach { addedBy[it.id] = endpoint to name }
                  while (addedBy.size > 3000) addedBy.remove(addedBy.keys.first())
                  publish()
              }

              /** Endpoint of the guest who added this song, if they're still in the jam. */
              fun creditFor(songId: String): String? = if (!isHost) null else addedBy[songId]?.first?.takeIf { it in members }

              fun sendListen(endpoint: String, song: Song, at: Long) = send(listOf(endpoint), buildJsonObject {
                  put("t", "listen")
                  put("song", AppJson.encodeToJsonElement(compact(song)))
                  put("at", at)
              })

              fun sendNowPlaying(endpoint: String, song: Song) = send(listOf(endpoint), buildJsonObject {
                  put("t", "nowPlaying")
                  put("song", AppJson.encodeToJsonElement(compact(song)))
              })

              private fun onHostMessage(endpoint: String, m: JsonElement) {
                  if (m["t"].str == "hello") {
                      val name = m["name"].str?.takeIf { it.isNotBlank() } ?: "Guest"
                      val isNew = endpoint !in members
                      members[endpoint] = name
                      publish()
                      if (isNew) g.toast("$name joined the jam")
                      broadcast(force = true)
                      return
                  }
                  if (m["t"].str != "cmd") return
                  val p = g.player
                  val name = members[endpoint] ?: "Guest"
                  val songs = m["songs"].decodeListAs<Song>()
                  val a = (m["a"].lng ?: 0L).toInt()
