                      IconButton(onClick = onLyrics) { Icon(Icons.Rounded.FormatQuote, "Lyrics", tint = MaterialTheme.colorScheme.onSurfaceVariant) }
                      IconButton(onClick = onQueue) { Icon(Icons.AutoMirrored.Rounded.QueueMusic, "Queue", tint = MaterialTheme.colorScheme.onSurfaceVariant) }
                  }
              }
          }

          @Composable
          private fun SeekBar(ps: PlayerState) {
              var dragging by remember { mutableStateOf(false) }
              var value by remember { mutableFloatStateOf(0f) }
              val dur = ps.durationMs.coerceAtLeast(1L)
              val shown = if (dragging) value else ps.positionMs.toFloat() / dur
              Slider(
                  value = shown.coerceIn(0f, 1f),
                  onValueChange = {
                      dragging = true
                      value = it
                  },
                  onValueChangeFinished = {
                      graph.player.seekTo((value * dur).toLong())
                      dragging = false
                  },
                  colors = SliderDefaults.colors(thumbColor = Color.White, activeTrackColor = Color.White),
              )
              Row(Modifier.fillMaxWidth()) {
                  Text(
                      formatMs(if (dragging) (value * dur).toLong() else ps.positionMs),
                      style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  Spacer(Modifier.weight(1f))
                  Text(formatMs(ps.durationMs), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
              }
          }

          @Composable
          fun LyricsView(song: Song, ps: PlayerState, modifier: Modifier = Modifier) {
              val r = rememberLoad(song.id) { graph.api.lyrics(song) }
              val lyrics = r.data
              when {
                  r.loading -> LoadingBox(modifier)
                  lyrics == null || lyrics.lines.isEmpty() -> Box(modifier, contentAlignment = Alignment.Center) {
                      Text("No lyrics found for this song", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
                  else -> {
                      val listState = rememberLazyListState()
                      val current = if (lyrics.synced) lyrics.lines.indexOfLast { (it.timeMs ?: 0L) <= ps.positionMs + 300 } else -1
                      LaunchedEffect(current) { if (current >= 0) listState.animateScrollToItem((current - 2).coerceAtLeast(0)) }
                      LazyColumn(modifier, state = listState, contentPadding = PaddingValues(horizontal = 8.dp, vertical = 24.dp)) {
                          itemsIndexed(lyrics.lines) { i, line ->
                              val base = MaterialTheme.colorScheme.onSurface
                              Text(
                                  line.text.ifBlank { "♪" },
                                  style = MaterialTheme.typography.headlineSmall,
                                  fontWeight = FontWeight.Bold,
                                  color = when {
                                      !lyrics.synced -> base
                                      i == current -> base
                                      i < current -> base.copy(alpha = 0.55f)
                                      else -> base.copy(alpha = 0.35f)
                                  },
                                  modifier = Modifier.fillMaxWidth()
                                      .clickable(enabled = lyrics.synced) { line.timeMs?.let { graph.player.seekTo(it) } }
                                      .padding(vertical = 6.dp),
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun QueueView(ps: PlayerState, modifier: Modifier = Modifier) {
              LazyColumn(modifier) {
                  item {
                      Text("Now playing", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.padding(16.dp))
                  }
                  ps.song?.let { s -> item { QueueRow(s, highlight = true, onClick = {}) } }
                  item {
                      Row(Modifier.fillMaxWidth().padding(start = 16.dp, end = 8.dp, top = 16.dp), verticalAlignment = Alignment.CenterVertically) {
                          Text(
                              if (ps.shuffle) "Next up (shuffled)" else "Next up",
                              style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f),
                          )
                          if (ps.upNext.isNotEmpty()) TextButton(onClick = { graph.player.clearUpNext() }) { Text("Clear") }
                      }
                  }
                  if (ps.upNext.isEmpty()) {
                      item { Text("Nothing queued", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(16.dp)) }
                  }
                  itemsIndexed(ps.upNext) { pos, (idx, s) ->
                      QueueRow(s, highlight = false, onClick = { graph.player.skipTo(idx) }) {
                          if (!ps.shuffle) {
                              IconButton(onClick = { graph.player.move(idx, idx - 1) }, enabled = pos > 0) {
                                  Icon(Icons.Rounded.ArrowUpward, "Move up", modifier = Modifier.size(20.dp))
                              }
                              IconButton(onClick = { graph.player.move(idx, idx + 1) }, enabled = pos < ps.upNext.size - 1) {
                                  Icon(Icons.Rounded.ArrowDownward, "Move down", modifier = Modifier.size(20.dp))
                              }
                          }
                          IconButton(onClick = { graph.player.removeAt(idx) }) { Icon(Icons.Rounded.Close, "Remove", modifier = Modifier.size(20.dp)) }
                      }
                  }
              }
          }

          @Composable
          private fun QueueRow(song: Song, highlight: Boolean, onClick: () -> Unit, trailing: @Composable RowScope.() -> Unit = {}) {
              val jam by graph.jam.state.collectAsStateWithLifecycle()
              val by = jam.addedBy[song.id]
              Row(
                  Modifier.fillMaxWidth().clickable(onClick = onClick).padding(start = 16.dp, end = 4.dp, top = 6.dp, bottom = 6.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Cover(song.coverArt, Modifier.size(44.dp), size = 150, shape = RoundedCornerShape(4.dp), albumId = song.albumId)
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(
                          song.title, maxLines = 1, overflow = TextOverflow.Ellipsis,
