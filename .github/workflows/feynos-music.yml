          package com.feynos.music.data

          import android.content.ContentValues
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import com.feynos.music.BuildConfig
          import com.feynos.music.Graph
          import com.feynos.music.util.AppJson
          import com.feynos.music.util.get
          import com.feynos.music.util.list
          import com.feynos.music.util.lng
          import com.feynos.music.util.md5
          import com.feynos.music.util.str
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.json.JsonElement
          import okhttp3.Request
          import java.io.File
          import java.io.IOException
          import java.util.concurrent.ConcurrentHashMap

          data class CoverCandidate(val url: String, val thumb: String, val source: String, val title: String, val artist: String)

          data class CoverRow(
              val albumId: String,
              val name: String,
              val artist: String,
              val coverArt: String?,
              val hash: String?,
              val missing: Boolean,
              val url: String?,
              val source: String?,
              val checkedAt: Long,
          )

          data class CoverScanState(
              val running: Boolean = false,
              val phase: String = "",
              val done: Int = 0,
              val total: Int = 0,
              val missing: Int = 0,
              val found: Int = 0,
          )

          /**
           * Finds albums that only have Navidrome's placeholder image and looks up real artwork on
           * the Cover Art Archive (MusicBrainz), Deezer and iTunes. Found art is shown everywhere in
           * the app (lists, player, notification, lock screen). Subsonic has no way to upload art,
           * so it is stored on the phone; "Save image" lets you drop it into the album folder.
           */
          class CoverArtFinder(private val g: Graph) {
              /** albumId -> image URL */
              val overrides = MutableStateFlow<Map<String, String>>(emptyMap())
              val scan = MutableStateFlow(CoverScanState())
              private var job: Job? = null
              private val mbLock = Mutex()
              private var lastMbCall = 0L
              private val ua = "FeynosMusic/${BuildConfig.VERSION_NAME} ( https://github.com/${BuildConfig.GITHUB_REPO.ifBlank { "feynos" }} )"

              fun load() {
                  overrides.value = g.db.coverOverrides()
              }

              // ---------- on-demand lookups ----------
              // When a cover fails to load anywhere in the app, that album is looked up right away
              // instead of waiting for the weekly scan.
              private val queue = Channel<String>(Channel.UNLIMITED)
              private val asked = ConcurrentHashMap<String, Long>()
              private var worker: Job? = null

              fun requestLookup(albumId: String?) {
                  if (albumId.isNullOrBlank() || overrides.value.containsKey(albumId)) return
                  if (!g.settings.current.autoCovers) return
                  val now = System.currentTimeMillis()
                  val last = asked[albumId]
                  if (last != null && now - last < RETRY_MS) return
                  asked[albumId] = now
                  if (worker?.isActive != true) worker = g.scope.launch(Dispatchers.IO) { for (id in queue) lookupOne(id) }
                  queue.trySend(albumId)
              }

              private suspend fun lookupOne(albumId: String) {
                  try {
                      val now = System.currentTimeMillis()
                      val old = g.db.coverRows().firstOrNull { it.albumId == albumId }
                      if (old?.url != null) return
                      if (old != null && old.missing && now - old.checkedAt < RETRY_MS) return
                      val album = g.api.album(albumId)
                      val best = bestMatch(album.artist.orEmpty(), album.name)
                      g.db.upsertCover(
                          CoverRow(albumId, album.name, album.artist.orEmpty(), album.coverArt, old?.hash ?: "none", true, best?.url, best?.source, now),
                      )
                      if (best != null) load()
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      // offline or server error: try again next time the cover is shown after the retry window
                  }
              }

              fun urlFor(albumId: String?): String? = albumId?.let { overrides.value[it] }

              // ---------- networking ----------

              private suspend fun json(url: String): JsonElement? = withContext(Dispatchers.IO) {
                  val req = Request.Builder().url(url).header("User-Agent", ua).header("Accept", "application/json").build()
                  g.http.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) return@use null
                      val b = r.body?.string().orEmpty()
                      if (b.isBlank()) null else AppJson.parseToJsonElement(b)
                  }
              }

              private suspend fun exists(url: String): Boolean = withContext(Dispatchers.IO) {
                  runCatching {
                      g.http.newCall(Request.Builder().url(url).head().header("User-Agent", ua).build()).execute().use { it.isSuccessful }
                  }.getOrDefault(false)
              }

              private suspend fun hashOf(url: String?): String? = withContext(Dispatchers.IO) {
                  if (url == null) return@withContext null
                  runCatching {
                      g.http.newCall(Request.Builder().url(url).build()).execute().use { r ->
                          if (!r.isSuccessful) return@use null
                          val b = r.body?.bytes() ?: return@use null
                          // An image the phone can't decode shows as a blank square, so treat it as missing.
                          val o = android.graphics.BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          android.graphics.BitmapFactory.decodeByteArray(b, 0, b.size, o)
                          if (o.outWidth <= 0 || o.outHeight <= 0) null else md5(String(b, Charsets.ISO_8859_1))
                      }
