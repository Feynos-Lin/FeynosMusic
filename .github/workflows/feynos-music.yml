                      Text(
                          row.artist + (row.source?.let { " · ${if (it == "manual") "picked by you" else it}" } ?: " · tap to pick by hand"),
                          maxLines = 1, overflow = TextOverflow.Ellipsis,
                      )
                  },
                  leadingContent = { Cover(row.coverArt, Modifier.size(52.dp), size = 150, albumId = row.albumId) },
                  colors = ListItemDefaults.colors(containerColor = Color.Transparent),
                  modifier = Modifier.clickable(onClick = onClick),
              )
          }
