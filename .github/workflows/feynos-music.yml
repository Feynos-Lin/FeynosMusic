          /** ListenBrainz (MetaBrainz) API: scrobbling, listen history, stats and curated playlists. */
          class ListenBrainzClient(private val http: OkHttpClient, private val settings: SettingsStore) {
              private val base = "https://api.listenbrainz.org"
              private val jsonType = "application/json".toMediaType()

              private suspend fun fetch(path: String, token: String? = settings.current.lbToken.ifBlank { null }): JsonElement? =
                  withContext(Dispatchers.IO) {
                      val rb = Request.Builder().url(base + path)
                      if (token != null) rb.header("Authorization", "Token $token")
                      http.newCall(rb.build()).execute().use { r ->
                          if (r.code == 204 || r.code == 404) return@use null
                          if (!r.isSuccessful) throw IOException("ListenBrainz returned HTTP ${r.code}")
                          val b = r.body?.string().orEmpty()
                          if (b.isBlank()) null else AppJson.parseToJsonElement(b)
                      }
                  }

              private fun enc(s: String) = Uri.encode(s)

              /** Returns the ListenBrainz user name for a valid token, or null. */
              suspend fun validate(token: String): String? {
                  val r = fetch("/1/validate-token", token.trim())
                  return if (r["valid"].str == "true") r["user_name"].str else null
              }

              suspend fun submitRaw(body: String): Boolean = withContext(Dispatchers.IO) {
                  val token = settings.current.lbToken
                  if (token.isBlank()) return@withContext false
                  val req = Request.Builder()
                      .url("$base/1/submit-listens")
                      .header("Authorization", "Token $token")
                      .post(body.toRequestBody(jsonType))
                      .build()
                  http.newCall(req).execute().use { it.isSuccessful }
              }

              fun listenBody(type: String, song: Song, listenedAtSec: Long?): String = buildJsonObject {
                  put("listen_type", type)
                  putJsonArray("payload") {
                      addJsonObject {
                          if (listenedAtSec != null) put("listened_at", listenedAtSec)
                          putJsonObject("track_metadata") {
                              put("artist_name", song.artist ?: "Unknown Artist")
                              put("track_name", song.title)
                              song.album?.let { put("release_name", it) }
                              putJsonObject("additional_info") {
                                  put("media_player", "Feynos Music")
                                  put("submission_client", "Feynos Music")
                                  put("submission_client_version", BuildConfig.VERSION_NAME)
                                  if (song.duration > 0) put("duration_ms", song.duration * 1000L)
                                  song.track?.let { put("tracknumber", it) }
                              }
                          }
                      }
                  }
              }.toString()

              private fun trackFromMeta(m: JsonElement?, listenedAt: Long? = null): LbTrack? {
                  val title = m["track_name"].str ?: return null
                  val artist = m["artist_name"].str ?: ""
                  val mbid = m["mbid_mapping"]["recording_mbid"].str ?: m["additional_info"]["recording_mbid"].str
                  return LbTrack(title, artist, m["release_name"].str, mbid, listenedAt)
              }

              suspend fun recentListens(user: String, count: Int = 100, maxTs: Long? = null): List<LbTrack> {
                  val q = "?count=$count" + (maxTs?.let { "&max_ts=$it" } ?: "")
                  return fetch("/1/user/${enc(user)}/listens$q")["payload"]["listens"].list().mapNotNull {
                      trackFromMeta(it["track_metadata"], it["listened_at"].lng)
                  }
              }

              suspend fun listenCount(user: String): Long? = fetch("/1/user/${enc(user)}/listen-count")["payload"]["count"].lng

              suspend fun topRecordings(user: String, range: String = "month", count: Int = 50): List<LbTrack> =
                  fetch("/1/stats/user/${enc(user)}/recordings?range=$range&count=$count")["payload"]["recordings"].list().mapNotNull {
                      val title = it["track_name"].str ?: return@mapNotNull null
                      LbTrack(title, it["artist_name"].str ?: "", it["release_name"].str, it["recording_mbid"].str,
                          count = (it["listen_count"].lng ?: 0).toInt())
                  }

              suspend fun topArtists(user: String, range: String = "month", count: Int = 20): List<Pair<String, Int>> =
                  fetch("/1/stats/user/${enc(user)}/artists?range=$range&count=$count")["payload"]["artists"].list().mapNotNull {
                      val name = it["artist_name"].str ?: return@mapNotNull null
                      name to (it["listen_count"].lng ?: 0).toInt()
                  }

              /** Playlists ListenBrainz generates for the user (Weekly Jams, Weekly Exploration, ...). */
              suspend fun createdFor(user: String): List<LbPlaylistRef> =
