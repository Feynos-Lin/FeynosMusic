          /** On-device store: listen history, offline ListenBrainz queue, downloads, generated mixes. */
          class LocalDb(context: Context) : SQLiteOpenHelper(context, "feynos.db", null, 2) {

              val changes = MutableStateFlow(0)
              private fun changed() = changes.update { it + 1 }

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE plays (id INTEGER PRIMARY KEY AUTOINCREMENT, song_id TEXT NOT NULL, artist TEXT, artist_id TEXT, album_id TEXT, duration INTEGER NOT NULL DEFAULT 0, played_at INTEGER NOT NULL, song_json TEXT NOT NULL)")
                  db.execSQL("CREATE INDEX idx_plays_time ON plays(played_at)")
                  db.execSQL("CREATE INDEX idx_plays_song ON plays(song_id)")
                  db.execSQL("CREATE TABLE lb_queue (id INTEGER PRIMARY KEY AUTOINCREMENT, body TEXT NOT NULL, created_at INTEGER NOT NULL)")
                  db.execSQL("CREATE TABLE downloads (song_id TEXT PRIMARY KEY, path TEXT NOT NULL, size INTEGER NOT NULL, created_at INTEGER NOT NULL, song_json TEXT NOT NULL)")
                  db.execSQL("CREATE TABLE mixes (id TEXT PRIMARY KEY, title TEXT NOT NULL, description TEXT, created_at INTEGER NOT NULL, cover_art TEXT, position INTEGER NOT NULL DEFAULT 0)")
                  db.execSQL("CREATE TABLE mix_tracks (mix_id TEXT NOT NULL, position INTEGER NOT NULL, song_json TEXT NOT NULL)")
                  db.execSQL("CREATE TABLE lb_match (k TEXT PRIMARY KEY, song_json TEXT, checked_at INTEGER NOT NULL)")
                  createCoverTable(db)
              }

              private fun createCoverTable(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS cover_art (album_id TEXT PRIMARY KEY, name TEXT, artist TEXT, cover_art TEXT, hash TEXT, missing INTEGER NOT NULL DEFAULT 0, url TEXT, source TEXT, checked_at INTEGER NOT NULL DEFAULT 0)")
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) createCoverTable(db)
              }

