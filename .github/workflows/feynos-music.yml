              companion object {
                  const val SERVICE_TYPE = "_feynosjam._tcp."
                  const val PREFIX = "wifi:"
              }

              private val app = context.applicationContext
              private val nsd = app.getSystemService(NsdManager::class.java)
              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newCachedThreadPool()
              private val counter = AtomicInteger(0)

              private class Peer(val socket: Socket, val writer: BufferedWriter)

              private val peers = ConcurrentHashMap<String, Peer>()
              private val services = ConcurrentHashMap<String, NsdServiceInfo>()
              private var server: ServerSocket? = null
              private var registration: NsdManager.RegistrationListener? = null
              private var discovery: NsdManager.DiscoveryListener? = null
              private var multicast: WifiManager.MulticastLock? = null

              // ---------------- Host ----------------

              fun host(name: String, onError: (String) -> Unit) {
                  try {
                      val s = ServerSocket(0)
                      server = s
                      io.execute {
                          while (!s.isClosed) {
                              val socket = try { s.accept() } catch (e: Exception) { break }
                              attach("$PREFIX${counter.incrementAndGet()}", socket, announce = true)
                          }
                      }
                      val info = NsdServiceInfo().apply {
                          serviceName = name
                          serviceType = SERVICE_TYPE
                          port = s.localPort
                      }
                      val listener = object : NsdManager.RegistrationListener {
                          override fun onServiceRegistered(info: NsdServiceInfo) {}
                          override fun onRegistrationFailed(info: NsdServiceInfo, errorCode: Int) {
                              main.post { onError("Wi-Fi jam unavailable (code $errorCode)") }
                          }
                          override fun onServiceUnregistered(info: NsdServiceInfo) {}
                          override fun onUnregistrationFailed(info: NsdServiceInfo, errorCode: Int) {}
                      }
                      registration = listener
                      nsd?.registerService(info, NsdManager.PROTOCOL_DNS_SD, listener)
                  } catch (e: Exception) {
                      onError("Wi-Fi jam unavailable: ${e.message}")
                  }
              }

              // ---------------- Guest ----------------

              fun discover(onFound: (id: String, name: String) -> Unit, onLost: (id: String) -> Unit) {
                  stopDiscovery()
                  runCatching {
                      multicast = app.getSystemService(WifiManager::class.java)?.createMulticastLock("feynos-jam")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }
