                      publishFound()
                  }

                  override fun onEndpointLost(endpointId: String) {
                      found.remove(endpointId)
                      publishFound()
                  }
              }

              private fun publishFound() {
                  _state.update { s -> s.copy(found = found.map { (id, name) -> JamEndpoint(id, name) }) }
              }

              private fun publish() {
                  _state.update {
                      it.copy(members = listOf(myName()) + members.values, addedBy = addedBy.mapValues { e -> e.value.second })
                  }
              }

              // ---------------- Starting / joining / leaving ----------------

              fun startHosting() {
                  if (_state.value.role != JamRole.NONE) return
                  members.clear(); addedBy.clear(); cursors.clear(); pendingNames.clear()
                  _state.value = JamState(role = JamRole.HOST, hostName = myName(), members = listOf(myName()))
                  client.startAdvertising(
