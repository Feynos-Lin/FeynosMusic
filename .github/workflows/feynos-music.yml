                      }
                      if (d.recent.isNotEmpty()) {
                          item { SectionHeader("Jump back in") { nav.route("history") } }
                          item {
                              LazyRow(contentPadding = PaddingValues(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                  itemsIndexed(d.recent) { i, s -> SongCard(s, onClick = { graph.player.play(d.recent, i) }) }
