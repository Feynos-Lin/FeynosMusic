                  val listener = object : NsdManager.DiscoveryListener {
                      override fun onDiscoveryStarted(serviceType: String) {}
                      override fun onDiscoveryStopped(serviceType: String) {}
                      override fun onStartDiscoveryFailed(serviceType: String, errorCode: Int) {}
                      override fun onStopDiscoveryFailed(serviceType: String, errorCode: Int) {}
                      override fun onServiceFound(info: NsdServiceInfo) {
                          if (!info.serviceType.contains("_feynosjam")) return
                          val id = PREFIX + info.serviceName
                          services[id] = info
                          main.post { onFound(id, info.serviceName) }
                      }
                      override fun onServiceLost(info: NsdServiceInfo) {
                          val id = PREFIX + info.serviceName
                          services.remove(id)
                          main.post { onLost(id) }
                      }
                  }
                  discovery = listener
                  runCatching { nsd?.discoverServices(SERVICE_TYPE, NsdManager.PROTOCOL_DNS_SD, listener) }
              }

              fun stopDiscovery() {
                  discovery?.let { d -> runCatching { nsd?.stopServiceDiscovery(d) } }
                  discovery = null
                  runCatching { multicast?.release() }
                  multicast = null
              }

              @Suppress("DEPRECATION")
              fun connect(id: String, onResult: (ok: Boolean, error: String?) -> Unit) {
                  val info = services[id] ?: return onResult(false, "That jam is no longer available")
                  nsd?.resolveService(info, object : NsdManager.ResolveListener {
                      override fun onResolveFailed(serviceInfo: NsdServiceInfo, errorCode: Int) {
                          main.post { onResult(false, "Couldn't reach that jam (code $errorCode)") }
                      }

                      override fun onServiceResolved(resolved: NsdServiceInfo) {
                          io.execute {
                              try {
                                  val socket = Socket()
                                  socket.connect(InetSocketAddress(resolved.host, resolved.port), 8000)
                                  attach(id, socket, announce = false)
                                  main.post { onResult(true, null) }
                              } catch (e: Exception) {
                                  main.post { onResult(false, "Couldn't connect: ${e.message}") }
                              }
                          }
                      }
