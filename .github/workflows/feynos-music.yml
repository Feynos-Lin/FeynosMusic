          private val FallbackBg = Color(0xFF2B2140)

          /** Extracts a dark, vibrant colour from album art for Spotify-style gradients. */
          @Composable
          fun rememberDominantColor(coverId: String?, albumId: String? = null): Color {
              val ctx = LocalContext.current
              var color by remember { mutableStateOf(FallbackBg) }
              val found by graph.covers.overrides.collectAsStateWithLifecycle()
              val url = (albumId ?: com.feynos.music.util.albumIdFromCover(coverId))?.let { found[it] } ?: graph.coverUrl(coverId, 200)
              LaunchedEffect(url) {
                  if (url == null) {
                      color = FallbackBg
                      return@LaunchedEffect
                  }
                  val req = ImageRequest.Builder(ctx).data(url).allowHardware(false).size(200)
                      .memoryCacheKey("pal:$url").build()
                  val bmp = (ctx.imageLoader.execute(req).drawable as? BitmapDrawable)?.bitmap ?: return@LaunchedEffect
                  val p = withContext(Dispatchers.Default) { Palette.from(bmp).generate() }
                  val c = p.getDarkVibrantColor(p.getMutedColor(p.getDominantColor(FallbackBg.toArgb())))
                  color = lerp(Color(c), Color.Black, 0.15f)
              }
              return animateColorAsState(color, tween(600), label = "dominant").value
          }

