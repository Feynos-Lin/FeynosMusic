              init {
                  // Keep the connection alive in the background for as long as we're in a jam.
                  g.scope.launch(Dispatchers.Main) {
                      var wasActive = false
                      state.collect { st ->
                          val active = st.role != JamRole.NONE
                          if (active && !wasActive) JamService.start(g.app)
                          if (!active && wasActive) JamService.stop(g.app)
                          wasActive = active
                      }
                  }
              }

              private fun reconnect(id: String, attempt: Int) {
                  if (!isGuest || hostEndpoint != id) return
                  _state.update { it.copy(error = "Connection dropped. Reconnecting… (try $attempt of 6)") }
                  wifi.connect(id) { ok, _ ->
                      if (!isGuest || hostEndpoint != id) return@connect
                      if (ok) {
                          send(listOf(id), buildJsonObject {
                              put("t", "hello")
                              put("name", myName())
                          })
                          _state.update { it.copy(error = null) }
                      } else if (attempt < 6) {
                          g.scope.launch(Dispatchers.Main) {
                              delay(3000)
                              reconnect(id, attempt + 1)
                          }
                      } else {
                          endLocal()
                          g.toast("Lost connection to the jam")
                      }
                  }
              }

              private fun myName(): String = g.settings.current.username.ifBlank { Build.MODEL ?: "Phone" }

              // ---------------- Nearby callbacks (all delivered on the main thread) ----------------

              private val payloads = object : PayloadCallback() {
                  override fun onPayloadReceived(endpointId: String, payload: Payload) {
                      val bytes = payload.asBytes() ?: return
                      val msg = runCatching { AppJson.parseToJsonElement(String(bytes, Charsets.UTF_8)) }.getOrNull() ?: return
                      when {
                          isHost -> onHostMessage(endpointId, msg)
                          isGuest -> onGuestMessage(msg)
                      }
                  }

                  override fun onPayloadTransferUpdate(endpointId: String, update: PayloadTransferUpdate) {}
              }

              private val lifecycle = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(endpointId: String, info: ConnectionInfo) {
                      pendingNames[endpointId] = info.endpointName
                      client.acceptConnection(endpointId, payloads)
                  }

                  override fun onConnectionResult(endpointId: String, result: ConnectionResolution) {
                      val ok = result.status.statusCode == ConnectionsStatusCodes.STATUS_OK
                      if (isHost) {
                          if (ok) {
                              val name = pendingNames[endpointId] ?: "Guest"
                              members[endpointId] = name
                              publish()
                              g.toast("$name joined the jam")
                              broadcast(force = true)
                          }
                      } else if (_state.value.connectingTo == endpointId) {
                          if (ok) {
                              hostEndpoint = endpointId
                              runCatching { client.stopDiscovery() }
                              g.player.pauseLocal()
                              _state.update {
                                  it.copy(
                                      role = JamRole.GUEST, searching = false, connectingTo = null, error = null,
                                      hostName = (found[endpointId] ?: "").removeSuffix("'s jam"),
                                  )
                              }
                              g.toast("Joined the jam")
                          } else {
                              _state.update { it.copy(connectingTo = null, error = "Couldn't join (code ${result.status.statusCode}). Try again.") }
                          }
                      }
                  }

                  override fun onDisconnected(endpointId: String) {
                      if (isHost) {
                          val name = members.remove(endpointId)
                          cursors.remove(endpointId)
