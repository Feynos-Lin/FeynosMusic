                  Icon(Icons.Rounded.CloudOff, null, tint = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.size(48.dp))
                  Spacer(Modifier.height(12.dp))
                  Text(message, textAlign = TextAlign.Center, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  if (onRetry != null) {
                      Spacer(Modifier.height(12.dp))
                      OutlinedButton(onClick = onRetry) { Text("Retry") }
                  }
              }
          }

          @Composable
          fun EmptyState(icon: ImageVector, title: String, body: String, action: (@Composable () -> Unit)? = null) {
              Column(Modifier.fillMaxWidth().padding(32.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Icon(icon, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(56.dp))
                  Spacer(Modifier.height(12.dp))
                  Text(title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(6.dp))
                  Text(body, textAlign = TextAlign.Center, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  if (action != null) {
                      Spacer(Modifier.height(16.dp))
                      action()
                  }
              }
          }

          /** Generic "loads, then shows" screen with a back button. */
          @Composable
          fun <T> LoadedScreen(r: LoadResult<T>, title: String, actions: @Composable RowScope.() -> Unit = {}, content: @Composable (T) -> Unit) {
              val nav = LocalNavi.current
              Column(Modifier.fillMaxSize()) {
                  TopBar(title, onBack = { nav.back() }, actions = actions)
                  val d = r.data
                  val err = r.error
                  when {
                      d != null -> content(d)
                      err != null -> ErrorBox(err) { r.reload() }
                      else -> LoadingBox()
                  }
              }
          }

          /** Big header used by albums, playlists, mixes. */
          @Composable
          fun CollectionHeader(
              coverId: String?,
              title: String,
              subtitle: String,
              meta: String,
              songs: List<Song>,
              onSubtitle: (() -> Unit)? = null,
              cover: (@Composable () -> Unit)? = null,
              albumId: String? = null,
              actions: @Composable RowScope.() -> Unit = {},
          ) {
              val downloads by graph.downloads.collectAsStateWithLifecycle()
              val allDownloaded = songs.isNotEmpty() && songs.all { it.id in downloads }
              Column(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Box(Modifier.fillMaxWidth(0.62f).widthIn(max = 300.dp).aspectRatio(1f).shadow(18.dp, RoundedCornerShape(8.dp))) {
                      if (cover != null) cover() else Cover(coverId, Modifier.fillMaxSize(), size = 800, shape = RoundedCornerShape(8.dp), albumId = albumId)
                  }
                  Spacer(Modifier.height(16.dp))
                  Text(title, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center)
                  if (subtitle.isNotBlank()) {
                      Text(
                          subtitle,
                          style = MaterialTheme.typography.titleSmall,
                          color = if (onSubtitle != null) MaterialTheme.colorScheme.onSurface else MaterialTheme.colorScheme.onSurfaceVariant,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.padding(top = 4.dp).then(if (onSubtitle != null) Modifier.clickable(onClick = onSubtitle) else Modifier),
                      )
                  }
                  Text(meta, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(top = 2.dp))
                  Row(Modifier.fillMaxWidth().padding(top = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                      actions()
                      IconButton(onClick = { graph.download(songs) }) {
                          Icon(
                              if (allDownloaded) Icons.Rounded.DownloadDone else Icons.Rounded.Download, "Download",
                              tint = if (allDownloaded) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                      IconButton(onClick = { graph.player.addToQueue(songs); graph.toast("Added to queue") }) {
                          Icon(Icons.AutoMirrored.Rounded.QueueMusic, "Add to queue", tint = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Spacer(Modifier.weight(1f))
                      IconButton(onClick = { graph.player.play(songs, shuffle = true) }, enabled = songs.isNotEmpty()) {
                          Icon(Icons.Rounded.Shuffle, "Shuffle", modifier = Modifier.size(28.dp))
                      }
                      Spacer(Modifier.width(8.dp))
                      FilledIconButton(onClick = { graph.player.play(songs) }, enabled = songs.isNotEmpty(), modifier = Modifier.size(56.dp)) {
                          Icon(Icons.Rounded.PlayArrow, "Play", modifier = Modifier.size(32.dp))
                      }
                  }
              }
          }

