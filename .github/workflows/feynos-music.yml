                              list == null || list.isEmpty() -> Text("No artwork found online for this album.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              else -> LazyVerticalGrid(
                                  columns = GridCells.Adaptive(96.dp),
                                  modifier = Modifier.heightIn(max = 380.dp),
