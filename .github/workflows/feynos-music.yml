                                  put("position", i)
                                  put("song_json", json(s))
                              })
                          }
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
                  changed()
              }

              private fun mixOf(c: Cursor) = Mix(c.getString(0), c.getString(1), c.getString(2) ?: "", c.getLong(3), c.getString(4), c.getInt(5))

              fun mixes(): List<Mix> =
                  query("SELECT id, title, description, created_at, cover_art, position FROM mixes ORDER BY position") { mixOf(it) }

              fun mix(id: String): Mix? =
                  query("SELECT id, title, description, created_at, cover_art, position FROM mixes WHERE id = ?", arrayOf(id)) { mixOf(it) }
                      .firstOrNull()

              fun mixSongs(id: String): List<Song> =
                  query("SELECT song_json FROM mix_tracks WHERE mix_id = ? ORDER BY position", arrayOf(id)) { songOf(it.getString(0)) }

