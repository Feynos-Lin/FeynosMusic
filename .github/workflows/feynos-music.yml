          @Composable
          fun AlbumGrid(type: String, modifier: Modifier = Modifier) {
              val albums = remember(type) { mutableStateListOf<Album>() }
              var end by remember(type) { mutableStateOf(false) }
              var loading by remember(type) { mutableStateOf(false) }
              var error by remember(type) { mutableStateOf<String?>(null) }
              val state = rememberLazyGridState()
              val nearEnd by remember {
                  derivedStateOf {
                      val last = state.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0
                      last >= state.layoutInfo.totalItemsCount - 12
                  }
              }
              LaunchedEffect(type, nearEnd, albums.size, end) {
                  if (!nearEnd || end || loading) return@LaunchedEffect
                  loading = true
                  try {
                      val page = graph.api.albumList(type, 60, albums.size)
                      albums.addAll(page)
                      if (page.size < 60 || type == "random") end = true
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      error = e.message
                      end = true
                  } finally {
                      loading = false
                  }
              }
              LazyVerticalGrid(
                  columns = GridCells.Adaptive(150.dp),
                  state = state,
                  modifier = modifier.fillMaxSize(),
                  contentPadding = PaddingValues(start = 12.dp, end = 12.dp, bottom = 24.dp),
              ) {
                  items(albums) { a -> AlbumCard(a, Modifier.fillMaxWidth()) }
                  if (loading) item(span = { GridItemSpan(maxLineSpan) }) { LoadingBox() }
                  val err = error
                  if (err != null && albums.isEmpty()) item(span = { GridItemSpan(maxLineSpan) }) { ErrorBox(err) }
              }
          }

