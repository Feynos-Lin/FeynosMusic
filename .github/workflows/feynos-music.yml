          enum class JamRole { NONE, HOST, GUEST }

          data class JamEndpoint(val id: String, val name: String)

          data class JamState(
              val role: JamRole = JamRole.NONE,
              val searching: Boolean = false,
              val connectingTo: String? = null,
              val hostName: String = "",
              val members: List<String> = emptyList(),
              val found: List<JamEndpoint> = emptyList(),
              /** songId -> name of the person who added it */
              val addedBy: Map<String, String> = emptyMap(),
              val error: String? = null,
