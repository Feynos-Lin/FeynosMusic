          import java.util.concurrent.atomic.AtomicInteger

          /**
           * Jam over the local Wi-Fi network: the host runs a small TCP server advertised with
           * Bonjour / NSD ("_feynosjam._tcp"), guests find it and connect. Messages are the same
           * JSON as the Bluetooth (Nearby) transport, one per line. This is how the Apple TV
           * talks to phones. All callbacks are delivered on the main thread.
