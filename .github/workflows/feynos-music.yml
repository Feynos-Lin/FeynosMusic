                  json?.let { runCatching { AppJson.decodeFromString<Song>(it) }.getOrNull() }

              private fun json(song: Song): String = AppJson.encodeToString(song)

              private inline fun <T> query(sql: String, args: Array<String> = emptyArray(), map: (Cursor) -> T?): List<T> {
                  val out = ArrayList<T>()
                  readableDatabase.rawQuery(sql, args).use { c ->
                      while (c.moveToNext()) map(c)?.let { out.add(it) }
                  }
                  return out
              }

