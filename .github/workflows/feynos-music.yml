# Feynos Music - a full-featured Navidrome client for Android.
# This single workflow file contains the entire Android project.
# Every run writes the project out, builds a signed APK and publishes it
# as a GitHub release (the app checks those releases to update itself).
name: Build Feynos Music

on:
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/feynos-music.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feynos-music-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write Gradle setup and resources
        run: |
          mkdir -p "app" "app/src/main" "app/src/main/res/drawable" "app/src/main/res/layout" "app/src/main/res/mipmap-anydpi-v26" "app/src/main/res/values" "app/src/main/res/xml"
          cat > 'build.gradle.kts' <<'FEYNOS_EOF_001'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.1.0" apply false
          }
          FEYNOS_EOF_001
          cat > 'gradle.properties' <<'FEYNOS_EOF_002'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FEYNOS_EOF_002
          cat > 'settings.gradle.kts' <<'FEYNOS_EOF_003'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FeynosMusic"
          include(":app")
          FEYNOS_EOF_003
          cat > 'app/build.gradle.kts' <<'FEYNOS_EOF_004'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          val buildNumber = (System.getenv("BUILD_NUMBER") ?: "1").toInt()
          val ghRepo = System.getenv("GITHUB_REPOSITORY") ?: ""

          android {
              namespace = "com.feynos.music"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.feynos.music"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
                  buildConfigField("String", "GITHUB_REPO", "\"$ghRepo\"")
              }

              signingConfigs {
                  create("release") {
                      val f = System.getenv("SIGNING_STORE_FILE")
                      if (f != null && file(f).exists()) {
                          storeFile = file(f)
                          storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                          keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                          keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      val rel = signingConfigs.getByName("release")
                      signingConfig = if (rel.storeFile != null) rel else signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-session:1.5.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.5.1")
              implementation("androidx.media3:media3-database:1.5.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.work:work-runtime-ktx:2.10.0")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.google.android.gms:play-services-nearby:19.3.0")
          }
          FEYNOS_EOF_004
          cat > 'app/src/main/AndroidManifest.xml' <<'FEYNOS_EOF_005'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <!-- Jam: phones find and talk to each other over Bluetooth / Wi-Fi Direct -->
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:name=".App"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.Feynos"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".player.PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".jam.JamService"
                      android:exported="false"
                      android:foregroundServiceType="connectedDevice" />

                  <receiver
                      android:name=".widget.PlayerWidget"
                      android:exported="false"
                      android:label="Feynos Music">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_player_info" />
                  </receiver>

                  <receiver
                      android:name=".widget.CoverWidget"
                      android:exported="false"
                      android:label="Feynos Music (cover screen)">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_cover_info" />
                      <!-- Shows this widget in the Galaxy Z Flip "Flex Window" (cover screen) widget list -->
                      <meta-data
                          android:name="com.samsung.android.appwidget.provider"
                          android:resource="@xml/samsung_cover_widget" />
                  </receiver>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
