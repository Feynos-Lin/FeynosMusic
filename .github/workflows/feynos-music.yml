                  Text(value, style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Black, color = MaterialTheme.colorScheme.primary)
                  Text(label, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
              }
          }

          @Composable
          private fun DayChart(days: List<Pair<String, Int>>) {
              val bar = MaterialTheme.colorScheme.primary
              val track = MaterialTheme.colorScheme.surfaceContainerHigh
              val max = (days.maxOfOrNull { it.second } ?: 0).coerceAtLeast(1)
              Column {
                  Canvas(Modifier.fillMaxWidth().height(120.dp)) {
                      val w = size.width / days.size
                      days.forEachIndexed { i, (_, c) ->
                          val h = size.height * c / max
                          drawRoundRect(track, topLeft = Offset(i * w + w * 0.15f, 0f), size = Size(w * 0.7f, size.height), cornerRadius = CornerRadius(6f))
                          if (c > 0) drawRoundRect(bar, topLeft = Offset(i * w + w * 0.15f, size.height - h), size = Size(w * 0.7f, h), cornerRadius = CornerRadius(6f))
                      }
                  }
                  if (days.size <= 7) {
                      Row(Modifier.fillMaxWidth()) {
                          days.forEach { (label, _) ->
                              Text(
                                  label, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.weight(1f), textAlign = androidx.compose.ui.text.style.TextAlign.Center,
                              )
                          }
                      }
                  }
              }
          }
