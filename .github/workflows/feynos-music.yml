              fun getMatch(key: String): Pair<Long, Song?>? =
                  query("SELECT checked_at, song_json FROM lb_match WHERE k = ?", arrayOf(key)) { c ->
                      c.getLong(0) to songOf(c.getString(1))
                  }.firstOrNull()

              fun putMatch(key: String, song: Song?) {
                  writableDatabase.insertWithOnConflict("lb_match", null, ContentValues().apply {
                      put("k", key)
                      put("song_json", song?.let { json(it) })
                      put("checked_at", System.currentTimeMillis())
                  }, SQLiteDatabase.CONFLICT_REPLACE)
              }

              fun clearMatches() {
                  writableDatabase.delete("lb_match", null, null)
              }

              // ---- Cover art finder ----

              fun coverRows(): List<CoverRow> =
                  query("SELECT album_id, name, artist, cover_art, hash, missing, url, source, checked_at FROM cover_art") { c ->
                      CoverRow(c.getString(0), c.getString(1) ?: "", c.getString(2) ?: "", c.getString(3), c.getString(4), c.getInt(5) != 0, c.getString(6), c.getString(7), c.getLong(8))
                  }

              fun upsertCover(r: CoverRow) {
                  writableDatabase.insertWithOnConflict("cover_art", null, ContentValues().apply {
                      put("album_id", r.albumId)
                      put("name", r.name)
                      put("artist", r.artist)
                      put("cover_art", r.coverArt)
                      put("hash", r.hash)
                      put("missing", if (r.missing) 1 else 0)
                      put("url", r.url)
                      put("source", r.source)
                      put("checked_at", r.checkedAt)
                  }, SQLiteDatabase.CONFLICT_REPLACE)
              }

              fun coverOverrides(): Map<String, String> =
                  query("SELECT album_id, url FROM cover_art WHERE url IS NOT NULL") { it.getString(0) to it.getString(1) }.toMap()
          }
