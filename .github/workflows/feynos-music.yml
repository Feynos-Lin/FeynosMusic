          private data class HomeData(
              val recent: List<Song>,
              val mixes: List<Mix>,
              val newest: List<Album>,
              val frequent: List<Album>,
              val recentAlbums: List<Album>,
              val random: List<Album>,
              val starred: List<Album>,
              val serverError: String?,
          )

          private fun greeting(): String = when (Calendar.getInstance().get(Calendar.HOUR_OF_DAY)) {
              in 5..11 -> "Good morning"
              in 12..17 -> "Good afternoon"
              else -> "Good evening"
          }

          @Composable
          fun HomeScreen() {
              val nav = LocalNavi.current
              val version by graph.dataVersion.collectAsStateWithLifecycle()
              val data = rememberLoad(version) {
                  coroutineScope {
                      val recent = async(Dispatchers.IO) { graph.db.recentSongs(20) }
                      val mixes = async(Dispatchers.IO) { graph.db.mixes() }
                      var err: String? = null
                      suspend fun albums(type: String): List<Album> = try {
                          graph.api.albumList(type, 20)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          err = e.message
                          emptyList()
                      }
                      val newest = async { albums("newest") }
                      val frequent = async { albums("frequent") }
                      val recentAlbums = async { albums("recent") }
                      val random = async { albums("random") }
                      val starred = async { albums("starred") }
                      HomeData(
                          recent.await(), mixes.await(), newest.await(), frequent.await(),
                          recentAlbums.await(), random.await(), starred.await(), err,
                      )
                  }
              }
              val d = data.data
              PullToRefreshBox(isRefreshing = data.loading && d != null, onRefresh = { data.reload() }, modifier = Modifier.fillMaxSize()) {
                  LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(bottom = 24.dp)) {
                      item {
