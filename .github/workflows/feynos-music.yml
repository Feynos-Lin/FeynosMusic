                                      ) {
                                          Box(Modifier.fillMaxWidth().aspectRatio(1f).clip(RoundedCornerShape(6.dp)).background(MaterialTheme.colorScheme.surfaceVariant)) {
                                              WebImage(c.thumb, Modifier.fillMaxSize())
                                          }
                                          Text(c.source, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary, maxLines = 1)
                                          Text(
