          import java.io.File
          import java.io.IOException

          data class UpdateInfo(val version: String, val code: Int, val notes: String, val apkUrl: String)

          /** Checks the GitHub repo this app was built from for newer releases and installs them. */
          class Updater(private val context: Context, private val http: OkHttpClient) {
              val repo: String = BuildConfig.GITHUB_REPO

              suspend fun check(): UpdateInfo? = withContext(Dispatchers.IO) {
                  if (repo.isBlank()) return@withContext null
                  val req = Request.Builder()
                      .url("https://api.github.com/repos/$repo/releases/latest")
                      .header("Accept", "application/vnd.github+json")
                      .build()
                  http.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) return@use null
                      val o = AppJson.parseToJsonElement(r.body?.string().orEmpty())
                      val tag = o["tag_name"].str ?: return@use null
                      val code = tag.substringAfterLast('.').filter { it.isDigit() }.toIntOrNull() ?: return@use null
                      val apk = o["assets"].list().firstOrNull { it["name"].str?.endsWith(".apk") == true }
                          ?.get("browser_download_url").str ?: return@use null
                      if (code <= BuildConfig.VERSION_CODE) return@use null
                      UpdateInfo(tag.removePrefix("v"), code, o["body"].str.orEmpty(), apk)
                  }
              }

              suspend fun download(info: UpdateInfo, onProgress: (Float) -> Unit): File = withContext(Dispatchers.IO) {
                  val dir = File(context.cacheDir, "updates").apply { mkdirs() }
                  dir.listFiles()?.forEach { it.delete() }
                  val out = File(dir, "FeynosMusic-${info.version}.apk")
                  http.newCall(Request.Builder().url(info.apkUrl).build()).execute().use { r ->
                      if (!r.isSuccessful) throw IOException("Download failed (HTTP ${r.code})")
                      val body = r.body ?: throw IOException("Empty download")
                      val total = body.contentLength().toFloat()
                      body.byteStream().use { input ->
                          out.outputStream().use { output ->
                              val buf = ByteArray(64 * 1024)
                              var read = 0L
                              while (true) {
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  output.write(buf, 0, n)
                                  read += n
                                  if (total > 0) onProgress(read / total)
                              }
                          }
                      }
                  }
                  out
              }

              /** Returns false if the user first needs to allow installs from this app. */
              fun install(file: File): Boolean {
                  if (!context.packageManager.canRequestPackageInstalls()) {
                      context.startActivity(
                          Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${context.packageName}"))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      )
                      return false
                  }
                  val uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                  context.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK),
                  )
                  return true
              }
          }
