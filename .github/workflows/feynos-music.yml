                      downloads.value = db.downloadMap()
                      covers.load()
                  }
              }

              fun toast(message: String) {
                  messages.tryEmit(message)
              }

              fun bump() = dataVersion.update { it + 1 }

              // ---------- Account ----------

              suspend fun login(server: String, user: String, password: String) {
                  val raw = server.trim().trimEnd('/')
                  val candidates =
                      if (raw.startsWith("http://") || raw.startsWith("https://")) listOf(raw)
                      else listOf("https://$raw", "http://$raw")
                  val salt = randomSalt()
                  val token = md5(password + salt)
                  var last: Exception? = null
                  for (url in candidates) {
                      val s = settings.current.copy(serverUrl = url, username = user.trim(), token = token, salt = salt)
                      try {
                          api.pingWith(s)
                          settings.update { s }
                          Workers.schedule(app)
                          return
                      } catch (e: Exception) {
                          last = e
                      }
                  }
                  throw last ?: Exception("Could not connect")
              }

              suspend fun logout() {
                  if (jam.state.value.role != com.feynos.music.jam.JamRole.NONE) jam.leave()
                  withContext(Dispatchers.Main) { player.stopAndClear() }
                  File(app.filesDir, "queue.json").delete()
                  settings.update { AppSettings(lbToken = it.lbToken, lbUser = it.lbUser) }
                  starOverrides.value = emptyMap()
              }

              // ---------- Playback helpers ----------

              fun isMetered(): Boolean {
                  val cm = app.getSystemService(ConnectivityManager::class.java) ?: return false
                  return cm.isActiveNetworkMetered
              }

              fun streamUri(song: Song): String {
                  downloads.value[song.id]?.let { path ->
                      val f = File(path)
                      if (f.exists()) return Uri.fromFile(f).toString()
                  }
                  val s = settings.current
                  val br = if (isMetered()) s.mobileBitrate else s.wifiBitrate
                  return api.streamUrl(song.id, br, s.format)
              }

              fun coverUrl(id: String?, size: Int = 500): String? =
                  id?.takeIf { it.isNotBlank() && settings.current.loggedIn }?.let { api.coverUrl(it, size) }

              /** Tells Navidrome / ListenBrainz what's playing now. */
              fun sendNowPlaying(s: Song) {
                  val cfg = settings.current
                  scope.launch(Dispatchers.IO) {
                      if (cfg.scrobbleNavidrome) runCatching { api.scrobble(s.id, System.currentTimeMillis(), false) }
                      if (cfg.scrobbleLb && cfg.lbToken.isNotBlank()) {
                          runCatching { lb.submitRaw(lb.listenBody("playing_now", s, null)) }
                      }
                  }
              }

              /** Records a finished listen: local history, Navidrome play count and ListenBrainz. */
              fun recordListen(s: Song, at: Long) {
                  val cfg = settings.current
                  scope.launch(Dispatchers.IO) {
                      runCatching { db.addPlay(s, at) }
                      if (cfg.scrobbleNavidrome) runCatching { api.scrobble(s.id, at, true) }
                      if (cfg.scrobbleLb && cfg.lbToken.isNotBlank()) {
                          val body = lb.listenBody("single", s, at / 1000)
                          val ok = runCatching { lb.submitRaw(body) }.getOrDefault(false)
                          if (!ok) {
                              db.queueLb(body)
                              Workers.flushListenBrainz(app)
                          }
                      }
                  }
              }

              /** Cover URL, preferring art found by the cover-art finder. */
              fun artUrl(coverId: String?, albumId: String?, size: Int = 500): String? =
                  covers.urlFor(albumId ?: albumIdFromCover(coverId)) ?: coverUrl(coverId, size)

              fun isStarred(song: Song): Boolean = starOverrides.value[song.id] ?: (song.starred != null)

              fun toggleStar(song: Song) = toggleStarId(song.id, isStarred(song), "song")

              fun toggleStarId(id: String, currentlyStarred: Boolean, kind: String) {
                  val now = !currentlyStarred
                  starOverrides.update { it + (id to now) }
                  scope.launch {
                      try {
                          when (kind) {
                              "album" -> if (now) api.star(albumId = id) else api.unstar(albumId = id)
                              "artist" -> if (now) api.star(artistId = id) else api.unstar(artistId = id)
                              else -> if (now) api.star(id = id) else api.unstar(id = id)
                          }
                          toast(if (now) "Added to Liked" else "Removed from Liked")
                      } catch (e: Exception) {
                          starOverrides.update { it + (id to currentlyStarred) }
                          toast("Couldn't update: ${e.message}")
                      }
                  }
              }

              suspend fun radioFor(song: Song): List<Song> {
                  val out = LinkedHashMap<String, Song>()
                  out[song.id] = song
                  runCatching { api.similarSongs(song.id, 50) }.getOrDefault(emptyList()).forEach { out.putIfAbsent(it.id, it) }
                  if (out.size < 15) song.artist?.let { a ->
                      runCatching { api.topSongs(a, 15) }.getOrDefault(emptyList()).forEach { out.putIfAbsent(it.id, it) }
                  }
                  if (out.size < 25) {
                      runCatching { api.randomSongs(30, song.genre) }.getOrDefault(emptyList()).forEach { out.putIfAbsent(it.id, it) }
                  }
                  return listOf(song) + out.values.drop(1).shuffled()
              }

              fun startRadio(song: Song) {
                  toast("Starting radio…")
                  scope.launch {
                      val list = radioFor(song)
                      withContext(Dispatchers.Main) { player.play(list, 0) }
                  }
              }

              fun startArtistRadio(artistId: String, artistName: String) {
                  toast("Starting radio…")
                  scope.launch {
                      val out = LinkedHashMap<String, Song>()
                      runCatching { api.topSongs(artistName, 10) }.getOrDefault(emptyList()).forEach { out.putIfAbsent(it.id, it) }
                      runCatching { api.similarSongsForArtist(artistId, 50) }.getOrDefault(emptyList()).forEach { out.putIfAbsent(it.id, it) }
                      val list = out.values.shuffled()
                      if (list.isEmpty()) toast("Nothing to play") else withContext(Dispatchers.Main) { player.play(list, 0) }
                  }
              }

              // ---------- Downloads ----------

              fun download(songs: List<Song>) {
                  val todo = songs.filter { it.id !in downloads.value && it.id !in activeDownloads.value }
                  if (todo.isEmpty()) {
                      toast("Already downloaded")
                      return
                  }
                  activeDownloads.update { it + todo.map { s -> s.id } }
                  todo.forEach { Workers.download(app, it) }
                  toast("Downloading ${todo.size} song${if (todo.size == 1) "" else "s"}")
              }

              fun removeDownload(song: Song) {
                  scope.launch(Dispatchers.IO) {
                      db.removeDownload(song.id)?.let { File(it).delete() }
                      downloads.value = db.downloadMap()
                  }
              }

              fun removeAllDownloads() {
                  scope.launch(Dispatchers.IO) {
                      db.downloadMap().keys.forEach { id -> db.removeDownload(id)?.let { File(it).delete() } }
                      downloads.value = db.downloadMap()
                      toast("Downloads removed")
                  }
              }

              fun clearStreamCache() {
                  scope.launch(Dispatchers.IO) {
                      MediaCache.clear(app)
                      toast("Streaming cache cleared")
                  }
              }

              // ---------- Mixes ----------

              fun maybeGenerateMixes() {
                  val s = settings.current
                  if (s.loggedIn && System.currentTimeMillis() - s.lastMixGen > 7L * 86_400_000L) generateMixesNow(quiet = true)
              }

              fun generateMixesNow(quiet: Boolean = false) {
                  if (generatingMixes.value) return
                  generatingMixes.value = true
                  scope.launch {
                      try {
                          val n = mixGen.generateAll()
                          if (!quiet) toast("Made $n mixes for you")
                      } catch (e: Exception) {
                          if (!quiet) toast("Couldn't make mixes: ${e.message}")
                      } finally {
                          generatingMixes.value = false
                      }
                  }
              }

              fun saveAsPlaylist(name: String, songs: List<Song>) {
                  scope.launch {
                      try {
                          val existing = api.playlists().firstOrNull { it.name == name }
                          if (existing != null) api.createPlaylist(null, songs.map { it.id }, existing.id)
                          else api.createPlaylist(name, songs.map { it.id })
                          toast("Saved \"$name\" to Navidrome")
                          bump()
                      } catch (e: Exception) {
                          toast("Couldn't save playlist: ${e.message}")
                      }
                  }
              }
          }
