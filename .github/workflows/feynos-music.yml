                      }
                      item {
                          Text(
                              "Plays per day", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(top = 20.dp, bottom = 8.dp),
                          )
                          DayChart(d.days)
                      }
                      if (d.topArtists.isNotEmpty()) {
                          item { Text("Top artists", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 20.dp, bottom = 8.dp)) }
                          item {
                              val max = d.topArtists.maxOf { it.count }.coerceAtLeast(1)
                              Column {
