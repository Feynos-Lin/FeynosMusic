              }

              private fun enc(s: String) = android.net.Uri.encode(s)
              private fun q(s: String) = s.replace("\"", "")

              /** "For All The Dogs (Explicit) [Deluxe Edition] - Remastered" -> "For All The Dogs" */
              private fun simplify(album: String): String = g.matcher.cleanTitle(album)
                  .replace(Regex("""\s+[-–:]\s+.*$"""), "")
                  .replace(NOISE, " ")
                  .replace(Regex("""\s+"""), " ")
                  .trim()
                  .ifBlank { album }

              private fun similar(a: String, b: String): Boolean {
                  val x = g.matcher.norm(a).replace(NOISE, " ").replace(Regex("""\s+"""), " ").trim()
                  val y = g.matcher.norm(b).replace(NOISE, " ").replace(Regex("""\s+"""), " ").trim()
                  if (x.isEmpty() || y.isEmpty()) return false
                  return x == y || (x.length >= 3 && y.contains(x)) || (y.length >= 3 && x.contains(y))
              }

              private suspend fun fromDeezer(artist: String, album: String): List<CoverCandidate> {
                  val query = if (artist.isBlank()) "album:\"${q(album)}\"" else "artist:\"${q(artist)}\" album:\"${q(album)}\""
                  return json("https://api.deezer.com/search/album?limit=6&q=${enc(query)}")["data"].list().mapNotNull {
                      val big = it["cover_xl"].str ?: it["cover_big"].str ?: return@mapNotNull null
                      if (big.contains("/images/cover//")) return@mapNotNull null // Deezer's own blank cover
                      CoverCandidate(big, it["cover_medium"].str ?: big, "Deezer", it["title"].str.orEmpty(), it["artist"]["name"].str.orEmpty())
                  }
              }

              /** Plain keyword search: forgives punctuation and small spelling differences. */
              private suspend fun fromDeezerLoose(artist: String, album: String): List<CoverCandidate> =
                  json("https://api.deezer.com/search/album?limit=10&q=${enc("$artist $album".trim())}")["data"].list().mapNotNull {
                      val big = it["cover_xl"].str ?: it["cover_big"].str ?: return@mapNotNull null
                      if (big.contains("/images/cover//")) return@mapNotNull null
                      CoverCandidate(big, it["cover_medium"].str ?: big, "Deezer", it["title"].str.orEmpty(), it["artist"]["name"].str.orEmpty())
                  }

              private suspend fun fromItunes(artist: String, album: String): List<CoverCandidate> =
                  json("https://itunes.apple.com/search?entity=album&limit=6&term=${enc("$artist $album".trim())}")["results"].list().mapNotNull {
                      val art = it["artworkUrl100"].str ?: return@mapNotNull null
                      CoverCandidate(
                          art.replace("100x100bb", "1000x1000bb"), art.replace("100x100bb", "300x300bb"), "iTunes",
                          it["collectionName"].str.orEmpty(), it["artistName"].str.orEmpty(),
                      )
                  }

              private suspend fun fromMusicBrainz(artist: String, album: String): List<CoverCandidate> {
                  val query = if (artist.isBlank()) "releasegroup:\"${q(album)}\"" else "releasegroup:\"${q(album)}\" AND artist:\"${q(artist)}\""
                  val res = mbLock.withLock {
                      val wait = 1100 - (System.currentTimeMillis() - lastMbCall)
                      if (wait > 0) delay(wait) // MusicBrainz allows about one request per second
                      lastMbCall = System.currentTimeMillis()
                      json("https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=5&query=${enc(query)}")
                  }
                  return res["release-groups"].list().mapNotNull {
                      val id = it["id"].str ?: return@mapNotNull null
                      if ((it["score"].lng ?: 0L) < 80) return@mapNotNull null
                      CoverCandidate(
                          "https://coverartarchive.org/release-group/$id/front-1200",
                          "https://coverartarchive.org/release-group/$id/front-250",
                          "Cover Art Archive", it["title"].str.orEmpty(), it["artist-credit"].list().firstOrNull()["name"].str.orEmpty(),
                      )
                  }
              }

              private suspend fun <T> safe(block: suspend () -> List<T>): List<T> = try {
                  block()
              } catch (e: CancellationException) {
                  throw e
              } catch (e: Exception) {
                  emptyList()
              }

              /** Every candidate from every source, for the manual picker. */
              suspend fun candidates(artist: String, album: String): List<CoverCandidate> =
                  safe { fromMusicBrainz(artist, album) } + safe { fromDeezer(artist, album) } + safe { fromItunes(artist, album) }

              /** The best automatic match, only accepted when the album and artist names agree. */
              suspend fun bestMatch(artist: String, album: String): CoverCandidate? {
                  fun ok(c: CoverCandidate) = similar(c.title, album) && (artist.isBlank() || c.artist.isBlank() || similar(c.artist, artist))
                  val simple = simplify(album)
                  val names = listOf(album, simple).distinct()
                  for (n in names) safe { fromDeezer(artist, n) }.firstOrNull { ok(it) }?.let { return it }
                  for (n in names) safe { fromDeezerLoose(artist, n) }.firstOrNull { ok(it) }?.let { return it }
                  for (n in names) safe { fromItunes(artist, n) }.firstOrNull { ok(it) }?.let { return it }
                  for (c in safe { fromMusicBrainz(artist, simple) }.filter { ok(it) }) if (exists(c.thumb)) return c
                  // Last try: album name only, but the artist must still agree.
                  return safe { fromDeezer("", simple) }.firstOrNull { ok(it) && artist.isNotBlank() && similar(it.artist, artist) }
              }

              // ---------- choosing art ----------

              fun set(album: Album, url: String, source: String) {
                  g.scope.launch(Dispatchers.IO) {
                      val old = g.db.coverRows().firstOrNull { it.albumId == album.id }
                      g.db.upsertCover(
                          CoverRow(album.id, album.name, album.artist.orEmpty(), album.coverArt, old?.hash, old?.missing ?: false, url, source, System.currentTimeMillis()),
                      )
                      load()
                  }
              }

              fun clear(albumId: String) {
                  g.scope.launch(Dispatchers.IO) {
                      g.db.coverRows().firstOrNull { it.albumId == albumId }?.let { g.db.upsertCover(it.copy(url = null, source = null)) }
                      load()
                  }
              }

              /** Saves the image so it can be copied into the album folder on the server as cover.jpg. */
              suspend fun saveToPhone(album: Album, url: String): String = withContext(Dispatchers.IO) {
                  val bytes = g.http.newCall(Request.Builder().url(url).header("User-Agent", ua).build()).execute().use { r ->
                      if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                      r.body?.bytes() ?: throw IOException("Empty image")
                  }
                  val name = "cover - ${album.artist.orEmpty()} - ${album.name}".replace(Regex("""[\\/:*?"<>|]"""), "_").take(120) + ".jpg"
                  if (Build.VERSION.SDK_INT >= 29) {
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "image/jpeg")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Feynos Music")
                      }
                      val resolver = g.app.contentResolver
                      val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: throw IOException("Couldn't create file")
                      resolver.openOutputStream(uri)?.use { it.write(bytes) } ?: throw IOException("Couldn't write file")
                      "Downloads/Feynos Music/$name"
                  } else {
                      val dir = File(g.app.getExternalFilesDir(Environment.DIRECTORY_PICTURES), "covers").apply { mkdirs() }
                      File(dir, name).writeBytes(bytes)
                      "${dir.path}/$name"
                  }
              }

              // ---------- scanning ----------

              fun startScan(full: Boolean = false) {
                  if (job?.isActive == true) return
                  job = g.scope.launch {
                      try {
                          val n = scanNow(full)
                          g.toast(if (n == 0) "No new cover art found" else "Found cover art for $n album${if (n == 1) "" else "s"}")
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          g.toast("Cover scan stopped: ${e.message}")
                      }
                  }
              }

              fun stopScan() {
                  job?.cancel()
                  scan.update { it.copy(running = false, phase = "") }
              }

              /** Returns the number of albums that got new art. */
              suspend fun scanNow(full: Boolean): Int = withContext(Dispatchers.IO) {
                  scan.value = CoverScanState(running = true, phase = "Loading albums")
                  try {
                      val albums = ArrayList<Album>()
                      var offset = 0
                      while (true) {
                          val page = g.api.albumList("alphabeticalByName", 500, offset)
                          albums += page
                          if (page.size < 500) break
                          offset += 500
                      }
                      val rows = g.db.coverRows().associateBy { it.albumId }.toMutableMap()

                      // 1) Fingerprint every album's server image (small size keeps this quick).
                      scan.value = CoverScanState(running = true, phase = "Checking artwork", total = albums.size)
                      for ((i, al) in albums.withIndex()) {
                          ensureActive()
                          val old = rows[al.id]
                          if (full || old == null || old.hash == null || old.coverArt != al.coverArt) {
                              val h = if (al.coverArt.isNullOrBlank()) "none" else hashOf(g.api.coverUrl(al.coverArt, 64)) ?: "none"
                              val row = CoverRow(al.id, al.name, al.artist.orEmpty(), al.coverArt, h, old?.missing ?: false, old?.url, old?.source, old?.checkedAt ?: 0L)
                              rows[al.id] = row
                              g.db.upsertCover(row)
                          }
                          scan.update { it.copy(done = i + 1) }
                      }

                      // 2) The placeholder is whatever image many unrelated albums share, plus what the
                      //    server returns for an album id that doesn't exist.
                      val fake = hashOf(g.api.coverUrl("al-feynos-missing-cover-check", 64))
                      val present = albums.map { it.id }.toSet()
                      val live = rows.values.filter { it.albumId in present }
                      val shared = live.groupBy { it.hash }
                          .filter { (h, list) -> h != null && list.size >= 3 && list.map { it.artist }.distinct().size >= 2 }
                          .keys
                      val placeholders = shared + setOfNotNull(fake, "none")
                      val missing = live.filter { it.hash in placeholders }
                      scan.value = CoverScanState(running = true, phase = "Finding artwork online", total = missing.size, missing = missing.size)

                      // Albums that now have real art on the server lose any automatic override.
                      for (row in live) {
                          if (row.hash !in placeholders && (row.missing || (row.url != null && row.source != "manual" && full))) {
                              g.db.upsertCover(row.copy(missing = false, url = if (row.source == "manual") row.url else null, source = if (row.source == "manual") row.source else null))
                          }
                      }

                      // 3) Look up art for each album that only has the placeholder.
                      var found = 0
                      val now = System.currentTimeMillis()
                      for ((i, row) in missing.withIndex()) {
                          ensureActive()
                          scan.update { it.copy(done = i) }
                          val recentlyFailed = row.missing && row.url == null && now - row.checkedAt < RETRY_MS
                          if (!full && (row.url != null || recentlyFailed)) continue
                          val best = bestMatch(row.artist, row.name)
                          g.db.upsertCover(row.copy(missing = true, url = best?.url ?: row.url, source = if (best != null) best.source else row.source, checkedAt = now))
                          if (best != null) {
                              found++
                              scan.update { it.copy(found = found) }
                              load()
                          }
                      }
                      load()
                      g.bump()
                      found
                  } finally {
                      scan.update { it.copy(running = false, phase = "") }
                  }
              }

              private companion object {
                  const val RETRY_MS = 86_400_000L // retry albums with no match once a day
                  val NOISE = Regex("""\b(deluxe|expanded|explicit|clean|remaster(ed)?|anniversary|special|super|edition|version|bonus|tracks?|reissue|complete)\b""", RegexOption.IGNORE_CASE)
              }
