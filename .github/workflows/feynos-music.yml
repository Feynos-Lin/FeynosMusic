                  }

              fun topSongs(since: Long, limit: Int): List<Pair<Song, Int>> =
                  query(
                      "SELECT song_json, COUNT(*) c FROM plays WHERE played_at >= ? GROUP BY song_id ORDER BY c DESC LIMIT $limit",
                      arrayOf(since.toString()),
