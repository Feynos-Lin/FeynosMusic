          @Composable
          fun LoginScreen() {
              var server by rememberSaveable { mutableStateOf("") }
              var user by rememberSaveable { mutableStateOf("") }
              var pass by rememberSaveable { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }
              val scope = rememberCoroutineScope()
              val focus = LocalFocusManager.current

              fun submit() {
                  if (busy || server.isBlank() || user.isBlank()) return
                  focus.clearFocus()
                  scope.launch {
                      busy = true
                      error = null
                      try {
                          graph.login(server, user, pass)
                      } catch (e: Exception) {
                          error = e.message ?: "Couldn't connect"
                      }
                      busy = false
                  }
              }

              Column(
                  Modifier.fillMaxSize()
                      .background(Brush.verticalGradient(listOf(MaterialTheme.colorScheme.primaryContainer, MaterialTheme.colorScheme.background)))
                      .statusBarsPadding().imePadding()
                      .verticalScroll(rememberScrollState())
                      .padding(24.dp),
              ) {
                  Spacer(Modifier.height(48.dp))
                  Box(
                      Modifier.size(72.dp).clip(RoundedCornerShape(20.dp)).background(MaterialTheme.colorScheme.primary),
                      contentAlignment = Alignment.Center,
                  ) { Icon(Icons.Rounded.MusicNote, null, tint = Color.White, modifier = Modifier.size(44.dp)) }
                  Spacer(Modifier.height(20.dp))
                  Text("Feynos Music", style = MaterialTheme.typography.headlineLarge, fontWeight = FontWeight.Black)
                  Text("Sign in to your Navidrome server", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  Spacer(Modifier.height(28.dp))
                  OutlinedTextField(
                      value = server, onValueChange = { server = it }, singleLine = true,
                      label = { Text("Server address") }, placeholder = { Text("music.example.com or 192.168.1.10:4533") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Uri, imeAction = ImeAction.Next),
                      modifier = Modifier.fillMaxWidth(),
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = user, onValueChange = { user = it }, singleLine = true, label = { Text("Username") },
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Next), modifier = Modifier.fillMaxWidth(),
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = pass, onValueChange = { pass = it }, singleLine = true, label = { Text("Password") },
                      visualTransformation = PasswordVisualTransformation(),
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password, imeAction = ImeAction.Done),
                      keyboardActions = KeyboardActions(onDone = { submit() }),
                      modifier = Modifier.fillMaxWidth(),
                  )
                  Spacer(Modifier.height(20.dp))
                  Button(
                      onClick = { submit() }, enabled = !busy && server.isNotBlank() && user.isNotBlank(),
                      modifier = Modifier.fillMaxWidth().height(52.dp),
                  ) {
                      if (busy) CircularProgressIndicator(Modifier.size(22.dp), strokeWidth = 2.dp) else Text("Connect")
                  }
                  error?.let {
                      Spacer(Modifier.height(12.dp))
                      Text(it, color = MaterialTheme.colorScheme.error)
                  }
                  Spacer(Modifier.height(20.dp))
                  Text(
                      "Tip: if you leave out http:// or https://, both are tried. Your password is never stored, only a salted token.",
                      style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }
          }

