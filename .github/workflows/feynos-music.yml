                              Text(greeting(), style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                              IconButton(onClick = { nav.route("jam") }) { Icon(Icons.Rounded.Groups, "Jam") }
                              IconButton(onClick = { nav.route("history") }) { Icon(Icons.Rounded.History, "History") }
                              IconButton(onClick = { nav.route("stats") }) { Icon(Icons.Rounded.BarChart, "Stats") }
                              IconButton(onClick = { nav.route("settings") }) { Icon(Icons.Rounded.Settings, "Settings") }
                          }
                      }
                      if (d == null) {
                          item { if (data.error != null) ErrorBox(data.error ?: "") { data.reload() } else LoadingBox() }
                          return@LazyColumn
                      }
                      if (d.serverError != null && d.newest.isEmpty() && d.random.isEmpty()) {
                          item {
                              ErrorBox("Can't reach your server right now (${d.serverError}). Downloaded music still plays.") { data.reload() }
                          }
                          item {
                              Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                                  OutlinedButton(onClick = { nav.route("downloads") }) { Text("Open downloads") }
                              }
                          }
                      }
                      item { QuickGrid(d) }
                      if (d.mixes.isNotEmpty()) {
                          item { SectionHeader("Made for you") { nav.route("foryou") } }
                          item {
                              LazyRow(contentPadding = PaddingValues(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                  items(d.mixes) { m -> MixCard(m) }
