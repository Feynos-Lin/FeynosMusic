                      arrayOf(since.toString()),
                  ) { c -> ArtistCount(c.getString(0), c.getString(1), c.getInt(2)) }

              fun playedIds(): Set<String> = query("SELECT DISTINCT song_id FROM plays") { it.getString(0) }.toSet()

              fun forgotten(before: Long, minPlays: Int, limit: Int): List<Song> =
                  query("SELECT song_json, COUNT(*) c, MAX(played_at) m FROM plays GROUP BY song_id HAVING c >= $minPlays AND m < $before ORDER BY c DESC LIMIT $limit") {
                      songOf(it.getString(0))
                  }

