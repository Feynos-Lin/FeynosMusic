              fun downloadedSongs(): List<Song> =
                  query("SELECT song_json FROM downloads ORDER BY created_at DESC") { songOf(it.getString(0)) }

              fun downloadsSize(): Long = query("SELECT COALESCE(SUM(size), 0) FROM downloads") { it.getLong(0) }.firstOrNull() ?: 0L

