          private data class StatsData(
              val stats: com.feynos.music.data.LocalDb.Stats,
              val topSongs: List<Pair<Song, Int>>,
              val topArtists: List<com.feynos.music.data.LocalDb.ArtistCount>,
              val days: List<Pair<String, Int>>,
          )

          @Composable
          fun StatsScreen() {
              val nav = LocalNavi.current
              var range by remember { mutableIntStateOf(0) }
              val ranges = listOf("7 days", "30 days", "1 year", "All time")
              val r = rememberLoad(range) {
                  withContext(Dispatchers.IO) {
                      val day = 86_400_000L
                      val now = System.currentTimeMillis()
                      val since = when (range) {
                          0 -> now - 7 * day
                          1 -> now - 30 * day
                          2 -> now - 365 * day
                          else -> 0L
                      }
                      val db = graph.db
                      val bucketDays = if (range == 0) 7 else 30
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      }
                      val todayStart = cal.timeInMillis
                      val times = db.playTimes(todayStart - (bucketDays - 1) * day)
                      val fmt = SimpleDateFormat(if (bucketDays == 7) "EEE" else "d", Locale.getDefault())
                      val days = (0 until bucketDays).map { i ->
                          val start = todayStart - (bucketDays - 1 - i) * day
                          fmt.format(Date(start)) to times.count { it >= start && it < start + day }
                      }
                      StatsData(db.stats(since), db.topSongs(since, 10), db.topArtists(since, 10), days)
                  }
              }
              Column(Modifier.fillMaxSize()) {
                  TopBar("Your stats", onBack = { nav.back() })
                  ChipRow(ranges, range) { range = it }
                  val d = r.data
                  if (d == null) LoadingBox() else StatsBody(d)
              }
          }

