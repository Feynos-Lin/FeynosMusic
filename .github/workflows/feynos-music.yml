          package com.feynos.music.work

          import android.content.Context
          import androidx.work.BackoffPolicy
          import androidx.work.Constraints
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.ExistingWorkPolicy
          import androidx.work.NetworkType
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import androidx.work.workDataOf
          import com.feynos.music.App
          import com.feynos.music.data.Song
          import com.feynos.music.util.AppJson
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.decodeFromString
          import kotlinx.serialization.encodeToString
          import okhttp3.Request
          import java.io.File
          import java.io.IOException
          import java.util.Calendar
          import java.util.concurrent.TimeUnit

          object Workers {
              private val network = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()

              /** Weekly mixes are rebuilt every Monday morning. */
              fun schedule(context: Context) {
                  val now = Calendar.getInstance()
                  val next = (now.clone() as Calendar).apply {
                      set(Calendar.DAY_OF_WEEK, Calendar.MONDAY)
                      set(Calendar.HOUR_OF_DAY, 6)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      if (!after(now)) add(Calendar.WEEK_OF_YEAR, 1)
                  }
                  val req = PeriodicWorkRequestBuilder<MixWorker>(7, TimeUnit.DAYS)
                      .setInitialDelay(next.timeInMillis - now.timeInMillis, TimeUnit.MILLISECONDS)
                      .setConstraints(network)
                      .build()
                  WorkManager.getInstance(context).enqueueUniquePeriodicWork("weekly_mixes", ExistingPeriodicWorkPolicy.KEEP, req)
              }

              fun flushListenBrainz(context: Context) {
                  val req = OneTimeWorkRequestBuilder<ListenBrainzFlushWorker>()
                      .setConstraints(network)
                      .setBackoffCriteria(BackoffPolicy.EXPONENTIAL, 1, TimeUnit.MINUTES)
                      .build()
                  WorkManager.getInstance(context).enqueueUniqueWork("lb_flush", ExistingWorkPolicy.KEEP, req)
              }

              fun download(context: Context, song: Song) {
                  val req = OneTimeWorkRequestBuilder<DownloadWorker>()
                      .setConstraints(network)
                      .setInputData(workDataOf("song" to AppJson.encodeToString(song)))
                      .addTag("download")
                      .build()
                  WorkManager.getInstance(context).enqueueUniqueWork("dl_${song.id}", ExistingWorkPolicy.KEEP, req)
              }
          }

          class MixWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              override suspend fun doWork(): Result {
                  val g = App.graph
                  if (!g.settings.current.loggedIn) return Result.success()
                  return try {
                      g.generatingMixes.value = true
                      g.mixGen.generateAll()
                      g.generatingMixes.value = false
                      if (g.settings.current.autoCovers) runCatching { g.covers.scanNow(full = false) }
                      Result.success()
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      if (runAttemptCount < 3) Result.retry() else Result.failure()
                  } finally {
                      g.generatingMixes.value = false
                  }
              }
          }

          class ListenBrainzFlushWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val g = App.graph
                  while (true) {
                      val batch = g.db.pendingLb(50)
                      if (batch.isEmpty()) break
                      for ((id, body) in batch) {
                          val ok = try {
                              g.lb.submitRaw(body)
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              false
                          }
                          if (!ok) return@withContext Result.retry()
                          g.db.deleteLb(id)
                      }
                  }
                  Result.success()
              }
          }

          class DownloadWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val g = App.graph
                  val song = inputData.getString("song")?.let { runCatching { AppJson.decodeFromString<Song>(it) }.getOrNull() }
                      ?: return@withContext Result.failure()
                  val s = g.settings.current
                  val dir = File(applicationContext.filesDir, "music").apply { mkdirs() }
                  val ext = if (s.downloadOriginal) (song.suffix ?: "mp3") else (if (s.format == "raw") "mp3" else s.format)
                  val out = File(dir, song.id.replace(Regex("[^A-Za-z0-9_-]"), "_") + "." + ext)
                  val tmp = File(out.path + ".part")
                  try {
                      val url = if (s.downloadOriginal) g.api.downloadUrl(song.id)
                      else g.api.streamUrl(song.id, s.mobileBitrate.takeIf { it > 0 } ?: 320, if (s.format == "raw") "mp3" else s.format)
                      g.http.newCall(Request.Builder().url(url).build()).execute().use { r ->
                          if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                          val body = r.body ?: throw IOException("Empty body")
                          body.byteStream().use { input -> tmp.outputStream().use { input.copyTo(it) } }
                      }
                      if (!tmp.renameTo(out)) throw IOException("Couldn't save file")
                      g.db.addDownload(song, out.path, out.length())
                      g.downloads.value = g.db.downloadMap()
                      g.activeDownloads.update { it - song.id }
                      Result.success()
                  } catch (e: CancellationException) {
                      tmp.delete()
                      throw e
                  } catch (e: Exception) {
                      tmp.delete()
                      if (runAttemptCount < 3) Result.retry() else {
                          g.activeDownloads.update { it - song.id }
                          Result.failure()
                      }
                  }
              }
          }
