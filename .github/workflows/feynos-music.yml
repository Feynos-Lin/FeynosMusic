                      albumRow("Recently added", d.newest) { nav.albums("newest") }
                      albumRow("Your most played", d.frequent) { nav.albums("frequent") }
                      albumRow("Liked albums", d.starred) { nav.albums("starred") }
                      albumRow("Something different", d.random) { nav.albums("random") }
