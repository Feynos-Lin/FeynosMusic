          @Composable
          private fun LocalHistory() {
              val history = remember { mutableStateListOf<Pair<Song, Long>>() }
              var end by remember { mutableStateOf(false) }
              val state = rememberLazyListState()
              val nearEnd by remember { derivedStateOf { (state.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0) >= history.size - 10 } }
              LaunchedEffect(nearEnd, history.size, end) {
                  if (!nearEnd || end) return@LaunchedEffect
                  val page = withContext(Dispatchers.IO) { graph.db.history(100, history.size) }
                  history.addAll(page)
                  if (page.size < 100) end = true
              }
              if (end && history.isEmpty()) {
                  EmptyState(Icons.Rounded.History, "Nothing played yet", "Songs you listen to will show up here.")
                  return
              }
              LazyColumn(Modifier.fillMaxSize(), state = state, contentPadding = PaddingValues(bottom = 24.dp)) {
                  itemsIndexed(history) { i, (song, at) ->
                      SongRow(song, onClick = { graph.player.play(history.map { it.first }, i) }, subtitle = "${song.artist.orEmpty()} · ${timeAgo(at)}")
                  }
              }
          }

