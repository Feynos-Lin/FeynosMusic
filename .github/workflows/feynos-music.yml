                          val artist = v["artist"]["name"].str ?: v["artist"]["artists"].list().firstOrNull()["name"].str ?: ""
                          out[mbid] = LbTrack(title, artist, v["release"]["name"].str, mbid)
                      }
                  }
                  return out
              }
