                      art = if (bmp.width > 400 || bmp.height > 400) Bitmap.createScaledBitmap(bmp, 400, 400, true) else bmp
                      render(context)
                  }
              }

              fun handle(context: Context, intent: Intent) {
                  val player = App.graph.player
                  when (intent.action) {
                      ACTION_TOGGLE -> player.toggle()
                      ACTION_NEXT -> player.next()
                      ACTION_PREV -> player.previous()
                  }
              }

              private fun action(context: Context, cls: Class<*>, action: String, code: Int): PendingIntent =
                  PendingIntent.getBroadcast(
                      context, code, Intent(context, cls).setAction(action),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT,
                  )

              private fun build(context: Context, layout: Int, cls: Class<*>, base: Int): RemoteViews =
                  RemoteViews(context.packageName, layout).apply {
                      setTextViewText(R.id.w_title, title)
                      setTextViewText(R.id.w_artist, artist)
                      setImageViewResource(R.id.w_play, if (playing) R.drawable.ic_w_pause else R.drawable.ic_w_play)
                      val bmp = art
                      if (bmp != null) setImageViewBitmap(R.id.w_art, bmp)
                      else if (layout == R.layout.widget_player) setImageViewResource(R.id.w_art, R.drawable.ic_w_note)
                      else setImageViewResource(R.id.w_art, android.R.color.transparent)
                      setOnClickPendingIntent(R.id.w_play, action(context, cls, ACTION_TOGGLE, base + 1))
                      setOnClickPendingIntent(R.id.w_next, action(context, cls, ACTION_NEXT, base + 2))
                      setOnClickPendingIntent(R.id.w_prev, action(context, cls, ACTION_PREV, base + 3))
                      val open = PendingIntent.getActivity(
                          context, base, Intent(context, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT,
                      )
                      setOnClickPendingIntent(R.id.w_art, open)
                      setOnClickPendingIntent(R.id.w_title, open)
                  }

              fun render(context: Context) {
                  val mgr = AppWidgetManager.getInstance(context)
                  val home = mgr.getAppWidgetIds(ComponentName(context, PlayerWidget::class.java))
                  if (home.isNotEmpty()) mgr.updateAppWidget(home, build(context, R.layout.widget_player, PlayerWidget::class.java, 100))
                  val cover = mgr.getAppWidgetIds(ComponentName(context, CoverWidget::class.java))
                  if (cover.isNotEmpty()) mgr.updateAppWidget(cover, build(context, R.layout.widget_cover, CoverWidget::class.java, 200))
              }
          }
