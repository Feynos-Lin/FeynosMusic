          private fun jamPermissions(): Array<String> {
              // Google's Nearby service still checks for location access on every Android version.
              val list = mutableListOf(Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION)
              if (Build.VERSION.SDK_INT >= 31) {
                  list += listOf(Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_ADVERTISE, Manifest.permission.BLUETOOTH_CONNECT)
              }
              if (Build.VERSION.SDK_INT >= 33) list += Manifest.permission.NEARBY_WIFI_DEVICES
              return list.toTypedArray()
          }

