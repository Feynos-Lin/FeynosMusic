          package com.feynos.music.data

          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import kotlinx.coroutines.withContext

          /** Finds the song in your Navidrome library that corresponds to a ListenBrainz track. */
          class TrackMatcher(private val api: SubsonicClient, private val db: LocalDb) {

              private val weekMs = 7L * 86_400_000L

              suspend fun match(title: String, artist: String, mbid: String? = null): Song? = withContext(Dispatchers.IO) {
                  val key = norm(artist) + "|" + norm(title)
                  val cached = db.getMatch(key)
                  if (cached != null) {
                      val (at, song) = cached
                      if (song != null || System.currentTimeMillis() - at < weekMs) return@withContext song
                  }
                  val firstArtist = artist.split(Regex(",|&| feat\\.| ft\\.| x | and ", RegexOption.IGNORE_CASE)).first().trim()
                  val queries = listOf("${cleanTitle(title)} $firstArtist", cleanTitle(title)).distinct()
                  var best: Song? = null
                  var bestScore = 0
                  for (q in queries) {
                      val results = try {
                          api.search(q, 0, 0, 25).song
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          return@withContext null // network problem: don't cache a miss
                      }
                      for (s in results) {
                          val sc = score(s, title, artist, mbid)
                          if (sc > bestScore) {
                              bestScore = sc
                              best = s
                          }
                      }
                      if (bestScore >= 85) break
                  }
                  val result = if (bestScore >= 60) best else null
                  db.putMatch(key, result)
                  result
              }

              suspend fun matchAll(tracks: List<LbTrack>, onEach: (Int, Song?) -> Unit = { _, _ -> }): List<Song?> =
                  coroutineScope {
                      val sem = Semaphore(4)
                      tracks.mapIndexed { i, t ->
                          async {
                              sem.withPermit {
                                  val s = try { match(t.title, t.artist, t.mbid) } catch (e: CancellationException) { throw e } catch (e: Exception) { null }
                                  onEach(i, s)
                                  s
                              }
                          }
                      }.awaitAll()
                  }

              fun cleanTitle(t: String): String = t
                  .replace(Regex("""\s*[(\[][^)\]]*[)\]]"""), "")
                  .replace(Regex("""\s+-\s+.*(remaster|version|edit|mix|live|mono|stereo).*""", RegexOption.IGNORE_CASE), "")
                  .trim()
                  .ifBlank { t }

              fun norm(s: String): String = cleanTitle(s).lowercase().replace(Regex("""[^\p{L}\p{N}]+"""), " ").trim()

              private fun score(s: Song, title: String, artist: String, mbid: String?): Int {
                  if (!mbid.isNullOrBlank() && s.musicBrainzId == mbid) return 100
                  val st = norm(s.title)
                  val t = norm(title)
                  if (st.isEmpty() || t.isEmpty()) return 0
                  var sc = when {
                      st == t -> 50
                      st.startsWith(t) || t.startsWith(st) -> 35
                      st.contains(t) || t.contains(st) -> 25
                      else -> return 0
                  }
                  val sa = norm(s.artist ?: "")
                  val a = norm(artist)
                  sc += when {
                      sa.isEmpty() || a.isEmpty() -> 0
                      sa == a -> 50
                      a.contains(sa) || sa.contains(a) -> 40
                      a.split(" ").any { it.length > 2 && sa.contains(it) } -> 20
                      else -> 0
                  }
                  return sc
              }
          }
