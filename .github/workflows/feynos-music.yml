          /**
           * A "jam": one phone (the host, connected to the stereo) plays; nearby phones join over
           * Bluetooth / Wi-Fi Direct and get full control of the shared queue. Everyone uses the same
           * Navidrome server, so a song id means the same song on every phone.
           */
          class JamManager(private val g: Graph) {
              companion object {
                  const val SERVICE_ID = "com.feynos.music.jam"
                  private const val MAX_BYTES = 30_000
                  private const val CHUNK = 40
