              val override = (albumId ?: albumIdFromCover(id))?.let { found[it] }
              val url = override ?: remember(id, size) { graph.coverUrl(id, size) }
              val cacheKey = if (override != null) "o:$override" else "c:$id:$size"
              Box(modifier.clip(shape).background(MaterialTheme.colorScheme.surfaceVariant), contentAlignment = Alignment.Center) {
