          import java.util.Date
          import java.util.Locale
          import java.util.UUID

          val AppJson = Json {
              ignoreUnknownKeys = true
              coerceInputValues = true
              isLenient = true
              explicitNulls = false
              encodeDefaults = true
          }

          val JsonElement?.obj: JsonObject? get() = this as? JsonObject
          val JsonElement?.str: String? get() = (this as? JsonPrimitive)?.contentOrNull
          val JsonElement?.lng: Long? get() = (this as? JsonPrimitive)?.longOrNull ?: (this as? JsonPrimitive)?.contentOrNull?.toDoubleOrNull()?.toLong()

          /** Subsonic sometimes returns a single object where a list is expected; treat both the same. */
          fun JsonElement?.list(): List<JsonElement> = when (this) {
              is JsonArray -> this
              is JsonObject -> listOf(this)
              else -> emptyList()
          }

          operator fun JsonElement?.get(key: String): JsonElement? = (this as? JsonObject)?.get(key)

          inline fun <reified T> JsonElement?.decodeAs(): T? =
              this?.let { runCatching { AppJson.decodeFromJsonElement<T>(it) }.getOrNull() }

          inline fun <reified T> JsonElement?.decodeListAs(): List<T> =
              list().mapNotNull { runCatching { AppJson.decodeFromJsonElement<T>(it) }.getOrNull() }

          fun md5(s: String): String =
              MessageDigest.getInstance("MD5").digest(s.toByteArray()).joinToString("") { "%02x".format(it) }

          fun randomSalt(): String = UUID.randomUUID().toString().replace("-", "").take(12)

          fun formatDuration(sec: Int): String {
              val s = sec.coerceAtLeast(0)
              return if (s >= 3600) "%d:%02d:%02d".format(s / 3600, (s % 3600) / 60, s % 60)
              else "%d:%02d".format(s / 60, s % 60)
          }

          fun formatMs(ms: Long): String = formatDuration((ms / 1000).toInt())

          fun totalDuration(sec: Int): String {
              val h = sec / 3600
              val m = (sec % 3600) / 60
              return if (h > 0) "$h hr $m min" else "$m min"
          }

          fun timeAgo(ms: Long): String {
              val d = (System.currentTimeMillis() - ms) / 1000
              return when {
                  d < 60 -> "just now"
                  d < 3600 -> "${d / 60} min ago"
                  d < 86400 -> "${d / 3600} hr ago"
                  d < 86400 * 7 -> "${d / 86400} d ago"
                  else -> SimpleDateFormat("MMM d, yyyy", Locale.getDefault()).format(Date(ms))
              }
          }

          fun stripHtml(s: String): String = s
              .replace(Regex("<a [^>]*>.*?</a>"), "")
              .replace(Regex("<[^>]*>"), "")
              .replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'").replace("&nbsp;", " ")
              .trim()

          /** Navidrome album cover ids look like "al-<albumId>_<hex>". */
          fun albumIdFromCover(coverId: String?): String? =
              coverId?.takeIf { it.startsWith("al-") }?.removePrefix("al-")?.substringBefore('_')?.takeIf { it.isNotBlank() }
