              private val client: ConnectionsClient by lazy { Nearby.getConnectionsClient(g.app) }
              private val _state = MutableStateFlow(JamState())
              val state: StateFlow<JamState> = _state.asStateFlow()

              val isHost: Boolean get() = _state.value.role == JamRole.HOST
              val isGuest: Boolean get() = _state.value.role == JamRole.GUEST

              private val members = LinkedHashMap<String, String>() // endpointId -> name (host side)
              private val pendingNames = HashMap<String, String>()
              private val found = LinkedHashMap<String, String>() // endpointId -> name (guest side)
              private val addedBy = LinkedHashMap<String, Pair<String?, String>>() // songId -> (guest endpoint or null, name)
              private val cursors = HashMap<String, Int>()
              private var hostEndpoint: String? = null
              private var broadcastJob: Job? = null
              private var lastSig = ""
              private var lastSent = 0L

              /** Jam over local Wi-Fi (works with the Apple TV). Runs alongside Bluetooth/Nearby. */
              private val wifi: WifiJam by lazy {
                  WifiJam(
                      g.app,
                      onConnected = { id ->
                          // Host: a guest connected over Wi-Fi; its name arrives in its "hello".
                          if (isHost) pendingNames[id] = "Guest"
                      },
                      onMessage = { id, line ->
                          val msg = runCatching { AppJson.parseToJsonElement(line) }.getOrNull()
                          if (msg != null) {
                              when {
                                  isHost -> onHostMessage(id, msg)
                                  isGuest && id == hostEndpoint -> onGuestMessage(msg)
                              }
                          }
                      },
                      onDisconnected = { id ->
                          // A Wi-Fi blip shouldn't kick a guest out: try to get back in first.
                          if (isGuest && id == hostEndpoint && wifi.isWifi(id)) reconnect(id, 1) else lifecycle.onDisconnected(id)
                      },
                  )
