                      AdvertisingOptions.Builder().setStrategy(Strategy.P2P_STAR).build(),
                  ).addOnFailureListener { e ->
                      // Wi-Fi guests (and the Apple TV) can still join.
                      _state.update { it.copy(error = "Bluetooth jam unavailable (${e.message}). Phones on the same Wi-Fi can still join.") }
                  }
                  wifi.host("${myName()}'s jam") { err -> _state.update { it.copy(error = err) } }
                  startBroadcasting()
              }

              fun startSearching() {
                  if (_state.value.role != JamRole.NONE) return
                  found.clear()
                  _state.value = JamState(searching = true)
                  client.startDiscovery(SERVICE_ID, discovery, DiscoveryOptions.Builder().setStrategy(Strategy.P2P_STAR).build())
                      .addOnFailureListener { e ->
                          _state.update { it.copy(error = "Bluetooth search unavailable (${e.message}). Still looking on Wi-Fi…") }
                      }
                  wifi.discover(
                      onFound = { id, name ->
                          found[id] = "$name (Wi-Fi)"
                          publishFound()
                      },
                      onLost = { id ->
                          found.remove(id)
                          publishFound()
                      },
                  )
              }

              fun stopSearching() {
                  runCatching { client.stopDiscovery() }
                  wifi.stopDiscovery()
                  _state.update { it.copy(searching = false, found = emptyList()) }
              }

              fun join(endpoint: JamEndpoint) {
                  _state.update { it.copy(connectingTo = endpoint.id, error = null) }
                  if (wifi.isWifi(endpoint.id)) {
                      wifi.connect(endpoint.id) { ok, err ->
                          if (ok) {
                              hostEndpoint = endpoint.id
                              runCatching { client.stopDiscovery() }
                              wifi.stopDiscovery()
                              g.player.pauseLocal()
                              _state.update {
                                  it.copy(
                                      role = JamRole.GUEST, searching = false, connectingTo = null, error = null,
                                      hostName = endpoint.name.removeSuffix(" (Wi-Fi)").removeSuffix("'s jam"),
                                  )
                              }
                              send(listOf(endpoint.id), buildJsonObject {
                                  put("t", "hello")
                                  put("name", myName())
                              })
                              g.toast("Joined the jam")
                          } else {
                              _state.update { it.copy(connectingTo = null, error = err ?: "Couldn't join") }
                          }
                      }
                      return
                  }
                  client.requestConnection(myName(), endpoint.id, lifecycle).addOnFailureListener { e ->
                      _state.update { it.copy(connectingTo = null, error = "Couldn't join: ${e.message}") }
                  }
              }

              /** Host: ends the jam for everyone. Guest: leaves it. */
              fun leave() {
                  if (isHost) members.keys.toList().takeIf { it.isNotEmpty() }?.let { send(it, buildJsonObject { put("t", "end") }) }
                  val wasHost = isHost
                  g.scope.launch(Dispatchers.Main) {
                      if (wasHost) delay(300) // let the "ended" message go out
                      endLocal()
                  }
              }

              private fun endLocal() {
                  val wasGuest = isGuest
                  stopBroadcasting()
                  runCatching { client.stopAdvertising() }
                  runCatching { client.stopDiscovery() }
                  runCatching { client.stopAllEndpoints() }
                  wifi.stopAll()
                  members.clear(); found.clear(); addedBy.clear(); cursors.clear(); pendingNames.clear()
                  hostEndpoint = null
                  _state.value = JamState()
                  if (wasGuest) g.player.clearRemote()
              }

              // ---------------- Messages ----------------

              private fun send(to: List<String>, msg: JsonObject) {
                  if (to.isEmpty()) return
                  val text = msg.toString()
                  val (overWifi, overNearby) = to.partition { wifi.isWifi(it) }
                  overWifi.forEach { wifi.send(it, text) }
                  if (overNearby.isNotEmpty()) {
                      runCatching { client.sendPayload(overNearby, Payload.fromBytes(text.toByteArray(Charsets.UTF_8))) }
                  }
              }

              private fun compact(s: Song) = s.copy(starred = null, playCount = null, musicBrainzId = null, bitRate = null)

