          // ---------------- Async loading ----------------

          class LoadResult<T> {
              var data by mutableStateOf<T?>(null)
              var error by mutableStateOf<String?>(null)
              var loading by mutableStateOf(true)
              var version by mutableIntStateOf(0)
              fun reload() {
                  version++
              }
          }

          @Composable
          fun <T> rememberLoad(vararg keys: Any?, block: suspend () -> T): LoadResult<T> {
              val r = remember(*keys) { LoadResult<T>() }
              LaunchedEffect(*keys, r.version) {
                  r.loading = true
                  r.error = null
                  try {
                      r.data = block()
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      r.error = e.message ?: e.toString()
                  } finally {
                      r.loading = false
                  }
              }
              return r
          }

