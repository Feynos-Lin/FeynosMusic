              private fun attach(id: String, socket: Socket, announce: Boolean) {
                  socket.tcpNoDelay = true
                  val writer = BufferedWriter(OutputStreamWriter(socket.getOutputStream(), Charsets.UTF_8))
                  peers[id] = Peer(socket, writer)
                  if (announce) main.post { onConnected(id) }
                  io.execute {
                      try {
                          val reader = BufferedReader(InputStreamReader(socket.getInputStream(), Charsets.UTF_8))
                          while (true) {
                              val line = reader.readLine() ?: break
                              if (line.isNotBlank()) main.post { onMessage(id, line) }
                          }
                      } catch (_: Exception) {
                      }
                      if (peers.remove(id) != null) main.post { onDisconnected(id) }
                      runCatching { socket.close() }
                  }
              }

              fun isWifi(id: String) = id.startsWith(PREFIX)

              fun send(id: String, line: String) {
                  val p = peers[id] ?: return
                  io.execute {
                      try {
                          synchronized(p) {
                              p.writer.write(line)
                              p.writer.write("\n")
                              p.writer.flush()
                          }
                      } catch (_: Exception) {
                          runCatching { p.socket.close() }
                      }
                  }
              }

              fun disconnect(id: String) {
                  peers.remove(id)?.let { p -> runCatching { p.socket.close() } }
              }

              fun stopAll() {
                  stopDiscovery()
                  registration?.let { r -> runCatching { nsd?.unregisterService(r) } }
                  registration = null
                  runCatching { server?.close() }
                  server = null
                  peers.keys.toList().forEach { disconnect(it) }
                  services.clear()
              }
          }
