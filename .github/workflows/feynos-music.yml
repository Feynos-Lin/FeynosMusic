          package com.feynos.music.data

          import com.feynos.music.Graph
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          /**
           * Builds the weekly curated playlists from local listen history, your Navidrome
           * library (similar songs / similar artists) and ListenBrainz (stats, recommendations
           * and the "created for you" playlists).
           */
          class MixGenerator(private val g: Graph) {
              private val day = 86_400_000L

              private inline fun <T> safe(block: () -> T): T? = try {
                  block()
              } catch (e: CancellationException) {
                  throw e
              } catch (e: Exception) {
                  null
              }

              private fun <T> interleave(vararg lists: List<T>): List<T> {
                  val out = ArrayList<T>()
                  val max = lists.maxOfOrNull { it.size } ?: 0
                  for (i in 0 until max) for (l in lists) if (i < l.size) out.add(l[i])
                  return out
              }

              suspend fun generateAll(): Int = withContext(Dispatchers.IO) {
                  val api = g.api
                  val db = g.db
                  val now = System.currentTimeMillis()
                  val s = g.settings.current
                  val lbUser = if (s.lbConnected) s.lbUser else null

                  val played = db.playedIds()
                  val onRepeat = db.topSongs(now - 30 * day, 40).map { it.first }
                  val allTimeTop = db.topSongs(0, 300).map { it.first }
                  val topArtists = db.topArtists(now - 90 * day, 8)

                  val lbTop = if (lbUser != null) safe { g.lb.topRecordings(lbUser, "month", 40) } ?: emptyList() else emptyList()
                  val lbTopSongs = g.matcher.matchAll(lbTop).filterNotNull()
                  val lbRefs = if (lbUser != null) safe { g.lb.createdFor(lbUser) } ?: emptyList() else emptyList()

                  val result = mutableListOf<Pair<Mix, List<Song>>>()
                  var pos = 0
                  fun add(id: String, title: String, desc: String, songs: List<Song>, min: Int = 5) {
                      val list = songs.distinctBy { it.id }
                      if (list.size >= min) {
                          result += Mix(id, title, desc, now, list.firstOrNull { it.coverArt != null }?.coverArt, pos++) to list
                      }
                  }

                  // 1. Weekly Mix: favourites + ListenBrainz top tracks + similar songs.
                  val similarPool = mutableListOf<Song>()
                  for (a in topArtists.take(5)) {
                      val seed = onRepeat.firstOrNull { it.artist == a.name } ?: allTimeTop.firstOrNull { it.artist == a.name } ?: continue
                      similarPool += safe { api.similarSongs(seed.id, 15) } ?: emptyList()
                  }
                  if (similarPool.size < 10) {
                      for (a in topArtists.take(5)) similarPool += safe { api.topSongs(a.name, 6) } ?: emptyList()
                  }
                  add(
                      "weekly", "Weekly Mix", "Your favourites mixed with songs like them. Refreshed every Monday.",
                      interleave(onRepeat.shuffled().take(15), lbTopSongs.shuffled().take(12), similarPool.shuffled().take(25)).take(50),
                  )

                  // 2. Discover Weekly: things in your library you've never played.
                  val discover = mutableListOf<Song>()
                  lbRefs.firstOrNull { it.title.contains("Exploration", ignoreCase = true) }?.let { ref ->
                      safe { g.lb.playlist(ref.mbid) }?.let { pl -> discover += g.matcher.matchAll(pl.second.take(50)).filterNotNull() }
                  }
                  if (lbUser != null) {
                      val recs = safe { g.lb.cfRecommendations(lbUser, 80) } ?: emptyList()
                      if (recs.isNotEmpty()) {
                          val meta = safe { g.lb.recordingMetadata(recs.take(50)) } ?: emptyMap()
                          discover += g.matcher.matchAll(meta.values.toList()).filterNotNull()
                      }
                  }
                  for (a in topArtists.take(6)) {
                      val id = a.id ?: continue
                      val info = safe { api.artistInfo(id) } ?: continue
                      for (sim in info.similarArtist.filter { it.id.isNotBlank() }.take(4)) {
                          val artist = safe { api.artist(sim.id) } ?: continue
                          val album = artist.album.randomOrNull() ?: continue
                          discover += (safe { api.album(album.id) }?.song ?: emptyList()).shuffled().take(2)
                      }
                  }
                  for (seed in onRepeat.take(5)) discover += safe { api.similarSongs(seed.id, 10) } ?: emptyList()
                  var unheard = discover.filter { it.id !in played }.distinctBy { it.id }
                  if (unheard.size < 25) {
                      unheard = unheard + (safe { api.randomSongs(150) } ?: emptyList()).filter { it.id !in played }.take(35 - unheard.size)
                  }
                  add("discover", "Discover Weekly", "Songs from your library you haven't played yet, picked for you.", unheard.shuffled().take(40))

                  // 3. Daily-mix style artist mixes.
                  topArtists.take(3).forEachIndexed { i, a ->
                      val pool = mutableListOf<Song>()
                      pool += allTimeTop.filter { it.artist == a.name }.take(10)
                      pool += safe { api.topSongs(a.name, 10) } ?: emptyList()
                      a.id?.let { id -> safe { api.similarSongsForArtist(id, 30) } }?.let { pool += it }
                      add("artist_$i", "${a.name} Mix", "${a.name} and artists like them.", pool.distinctBy { it.id }.shuffled().take(40), min = 8)
                  }

                  // 4. On Repeat / Forgotten Gems / Fresh Finds.
                  add("repeat", "On Repeat", "The songs you can't stop playing right now.", onRepeat.take(30))
                  add("gems", "Forgotten Gems", "Old favourites you haven't played in a while.", db.forgotten(now - 60 * day, 3, 30).shuffled())
                  val newest = safe { api.albumList("newest", 12) } ?: emptyList()
                  val freshFinds = newest.flatMap { al ->
                      (safe { api.album(al.id) }?.song ?: emptyList()).filter { it.id !in played }.shuffled().take(3)
                  }
                  add("fresh", "Fresh Finds", "New additions to your library you haven't heard yet.", freshFinds.take(40))

                  // 5. ListenBrainz "created for you" playlists, matched to your library.
                  for (ref in lbRefs.take(4)) {
                      val pl = safe { g.lb.playlist(ref.mbid) } ?: continue
                      val songs = g.matcher.matchAll(pl.second.take(60)).filterNotNull()
                      val title = pl.first.substringBefore(" for ").trim().ifBlank { pl.first }
                      add("lb_${ref.mbid}", title, "From ListenBrainz, matched to your library.", songs)
                  }

                  db.replaceMixes(result)

                  if (s.syncMixes) {
                      val existing = safe { api.playlists() } ?: emptyList()
                      for ((mix, songs) in result) {
                          val name = "Feynos · ${mix.title}"
                          val ex = existing.firstOrNull { it.name == name }
                          safe {
                              if (ex != null) api.createPlaylist(null, songs.map { it.id }, ex.id)
                              else api.createPlaylist(name, songs.map { it.id })
                          }
                      }
                  }

                  g.settings.update { it.copy(lastMixGen = now) }
                  g.bump()
                  result.size
              }
          }
