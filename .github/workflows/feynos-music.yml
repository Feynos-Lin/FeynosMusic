                      modifier = Modifier.fillMaxSize(0.4f),
                  )
                  if (url != null) {
                      val request = remember(url) {
                          ImageRequest.Builder(ctx).data(url)
                              .memoryCacheKey(cacheKey).diskCacheKey(cacheKey)
                              .crossfade(true).build()
