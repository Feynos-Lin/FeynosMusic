              fun replaceMixes(mixes: List<Pair<Mix, List<Song>>>) {
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      db.delete("mixes", null, null)
                      db.delete("mix_tracks", null, null)
                      for ((mix, songs) in mixes) {
                          db.insert("mixes", null, ContentValues().apply {
                              put("id", mix.id)
                              put("title", mix.title)
                              put("description", mix.description)
                              put("created_at", mix.createdAt)
                              put("cover_art", mix.coverArt)
                              put("position", mix.position)
                          })
                          songs.forEachIndexed { i, s ->
