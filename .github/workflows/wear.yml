name: Build Wear OS app

on:
  push:
    branches: [main]
    paths:
      - 'wear/**'
      - '.github/workflows/wear.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Must be the same key as the phone app, or Wear OS won't let the two apps talk.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS:-feynos}" >> "$GITHUB_ENV"
          else
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/.signing/feynos-music.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=feynos-music" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=feynos-music" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=feynos" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: wear
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log; then
            echo "::error::$(grep -E '^e: |What went wrong|error:' build.log | head -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "../FeynosMusicWear-1.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wear-v1.0.${{ github.run_number }}
          name: Feynos Music for Wear OS 1.0.${{ github.run_number }}
          make_latest: false
          body: |
            Watch remote for Feynos Music on your phone (Wear OS 3+, e.g. OnePlus Watch 2).
            Needs Feynos Music 1.0.24 or newer on the phone.

            Install: see "Installing on your watch" in the repository README, or use the Wear Installer 2 app on your phone.
          files: FeynosMusicWear-1.0.${{ github.run_number }}.apk
