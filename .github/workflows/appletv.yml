# Builds the Apple TV app on a Mac to check it compiles, then saves the generated
# Xcode project (FeynosMusicTV.xcodeproj) into the repo so it's ready to open in Xcode.
name: Build Apple TV app

on:
  push:
    branches: [ main ]
    paths: [ 'appletv/**', '.github/workflows/appletv.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appletv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: appletv
        run: xcodegen generate

      - name: Build for Apple TV (unsigned, just to check it compiles)
        working-directory: appletv
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild build \
            -project FeynosMusicTV.xcodeproj \
            -scheme FeynosMusicTV \
            -destination 'generic/platform=tvOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compile errors
        if: failure()
        working-directory: appletv
        run: grep -E "error:" -A3 build.log | head -150 || true

      - name: Save the Xcode project to the repo
        run: |
          rm -f appletv/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appletv/FeynosMusicTV.xcodeproj appletv/FeynosMusicTV/Info.plist
          if git diff --cached --quiet; then
            echo "Xcode project unchanged"
          else
            git commit -m "Update Apple TV Xcode project [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
